name: Tokyo validated Sheet compiler
on:
  schedule:
    - cron: '17 19 * * *' # Taiwan 03:17; bidirectional connector sync runs on its existing schedule
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokyo-data-update
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile validated public data (never rewrite HTML)
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: python scripts/build_tokyo.py
      - name: Validate page and data
        run: node scripts/check_tokyo.cjs
      - name: Commit only a validated data change
        shell: bash
        run: |
          if git diff --quiet -- 2026/tokyo/trip.json; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re, datetime
          path=Path('2026/tokyo/sw.js')
          version='tokyo-v2-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d%H%M%S')
          path.write_text(re.sub(r"const VERSION='[^']+'", "const VERSION='"+version+"'", path.read_text()))
          PY
          git config user.name "Tokyo trip data updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/tokyo/trip.json 2026/tokyo/sw.js 2026/tokyo/research/sync-state.json
          git commit -m "Update validated Tokyo trip data from Sheet"
          git push origin HEAD:main
