name: Tokyo validated Sheet compiler
on:
  pull_request:
    paths:
      - 'scripts/verify_tokyo_route_authority.py'
      - 'scripts/test_tokyo_route_authority.py'
      - 'scripts/tokyo_sync_mode.py'
      - 'scripts/test_tokyo_sync_mode.py'
      - 'scripts/export_tokyo_site_mirror.py'
      - 'scripts/test_tokyo_site_mirror.py'
      - 'scripts/audit_tokyo_sheet_mirror.py'
      - 'scripts/test_tokyo_sheet_mirror_audit.py'
      - '2026/tokyo/research/sync-policy.json'
      - '.github/workflows/gemini.yml'
  schedule:
    - cron: '17 19 * * *' # Taiwan 03:17; Sheet->website compilation gated until verified Dec 1 activation
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokyo-data-update
  cancel-in-progress: false
jobs:
  route-authority-pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify route and sync direction without publishing
        run: |
          python scripts/test_tokyo_route_authority.py
          python scripts/verify_tokyo_route_authority.py
          python scripts/test_tokyo_sync_mode.py
          python scripts/test_tokyo_site_mirror.py
          python scripts/test_tokyo_sheet_mirror_audit.py
          python scripts/export_tokyo_site_mirror.py --compare-sha "$(git hash-object 2026/tokyo/trip.json)"
  direction-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sheet_to_site: ${{ steps.mode.outputs.sheet_to_site }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute sync mode from owner approval and date
        id: mode
        run: |
          python scripts/test_tokyo_sync_mode.py
          python scripts/test_tokyo_site_mirror.py
          python scripts/test_tokyo_sheet_mirror_audit.py
          python scripts/export_tokyo_site_mirror.py --compare-sha "$(git hash-object 2026/tokyo/trip.json)"
          python scripts/tokyo_sync_mode.py
          echo "sheet_to_site=$(python scripts/tokyo_sync_mode.py --allow-sheet-to-site)" >> "$GITHUB_OUTPUT"
          echo "Before validated Dec 1 activation, Sheet -> website compiler is intentionally skipped."
  compile:
    needs: direction-gate
    if: github.event_name != 'pull_request' && needs.direction-gate.outputs.sheet_to_site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile validated public data (never rewrite HTML)
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: python scripts/build_tokyo.py
      - name: Compile budget when its CSV source is configured
        env:
          GOOGLE_BUDGET_CSV_URL: ${{ secrets.GOOGLE_BUDGET_CSV_URL }}
        run: |
          if [ -n "$GOOGLE_BUDGET_CSV_URL" ]; then python scripts/build_tokyo_budget.py; fi
      - name: Preserve owner-confirmed Dec 20 morning group route
        run: |
          python scripts/test_tokyo_route_authority.py
          python scripts/verify_tokyo_route_authority.py
      - name: Validate public data
        run: node scripts/check_tokyo.cjs
      - name: Commit only a validated data change
        shell: bash
        run: |
          if git diff --quiet -- 2026/tokyo/trip.json; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re, datetime
          path=Path('2026/tokyo/sw.js')
          version='tokyo-v2-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d%H%M%S')
          path.write_text(re.sub(r"const VERSION='[^']+'", "const VERSION='"+version+"'", path.read_text()))
          PY
          git config user.name "Tokyo trip data updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/tokyo/trip.json 2026/tokyo/sw.js 2026/tokyo/research/sync-state.json
          git commit -m "Update validated Tokyo trip data from Sheet"
          git push origin HEAD:main
