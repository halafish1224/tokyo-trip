name: Gemini Tokyo Trip Auto Updater

on:
  schedule:
    - cron: '0 0 * * 1' # 每週一凌晨 0:00 (UTC) 自動定時執行
  workflow_dispatch: # 支援在 GitHub 頁面手動點擊按鈕觸發

jobs:
  update-tokyo-trip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

- name: Run Gemini Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          python .github/scripts/update_tokyo_trip.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style/update: Gemini 自動更新東京行程資訊、交通與在地美食"
          title: "🤖 [Gemini Auto-Update] 自動更新東京行程、交通與美食資訊"
          body: |
            ## 🤖 Gemini 智慧行程更新報告
            本 PR 由 GitHub Actions 自動觸發，已使用 Gemini API 更新 `2026/tokyo/index.html`：
            - 🚆 景點交通路線與轉乘規劃優化
            - 🍱 增補周邊 Google 評分 3.5 ~ 4.0 星隱藏版在地美食
            - 🌤️ 確保氣象與每日行程擴充模組完整運作
            
            請專案維護者審閱變更後點擊 Merge 合併！
          branch: gemini-tokyo-update
          base: main
          delete-branch: true
