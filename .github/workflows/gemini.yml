name: Gemini Tokyo Trip Auto Updater

on:
  schedule:
    - cron: '0 16 * * *' # 每日台灣時間 00:00 (UTC 16:00) 自動定時執行
  workflow_dispatch: # 支援在 GitHub 頁面手動點擊觸發

jobs:
  update-tokyo-trip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pandas tabulate

      - name: Run Gemini Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          python .github/scripts/update_tokyo_trip.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style/update: 自動同步 Google Sheet 最新行程與景點網頁"
          title: "🤖 [Gemini Auto-Update] 自動同步 Google Sheet 最新行程"
          body: |
            ## 🤖 Gemini 網格功課表同步報告
            本 PR 已自動擷取最新的 Google Sheet 功課表，並經由 Gemini API 重構更新 `2026/tokyo/index.html`：
            - 🗓️ 依據時間段（06:00~22:00）同步每日最新行程
            - 🚆 景點交通與轉乘規劃優化
            - 🍱 周邊 Google 評分 3.5~4.0 星隱藏版在地美食
            
            請審閱變更後點擊 Merge 合併！
          branch: gemini-tokyo-daily-update
          base: main
          delete-branch: true
