<div id="tokyo-fare-container">
<style>
    /* --- 核心樣式 --- */
    #tokyo-fare-container {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #FFFBF0;
        color: #3E2723;
        max-width: 100%;
        margin: 0 auto;
        padding-bottom: 60px;
        border-radius: 8px;
        line-height: 1.6;
        box-sizing: border-box;
    }

    #tokyo-fare-container header {
        background: linear-gradient(135deg, #C62828, #B71C1C);
        color: #FFF;
        padding: 20px 15px;
        text-align: center;
        border-radius: 8px 8px 0 0;
    }

    /* --- 日期導航 --- */
    #tokyo-fare-container .date-nav {
        padding: 5px 10px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-bottom: 10px;
    }
    
    #tokyo-fare-container .date-btn {
        flex: 0 0 auto;
        padding: 10px 5px;
        border-radius: 6px;
        border: 1px solid #E0E0E0;
        background: #FFFFFF;
        color: #555;
        font-size: 13px;
        cursor: pointer;
        width: calc(20% - 6px);
        text-align: center;
        font-weight: bold;
    }
    
    @media (max-width: 400px) { #tokyo-fare-container .date-btn { width: calc(25% - 6px); } }

    #tokyo-fare-container .date-btn.active {
        background: #C62828;
        color: white;
        border-color: #C62828;
    }

    #tokyo-fare-container .timeline { padding: 10px 15px; }

    /* --- 行程卡片樣式 --- */
    #tokyo-fare-container .card {
        background: #FFF;
        border-radius: 8px;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        border-left: 5px solid #999;
        overflow: hidden;
    }

    .type-base { border-left-color: #C62828 !important; } 
    .type-food { border-left-color: #F9A825 !important; } 
    .type-shop { border-left-color: #6A1B9A !important; } 
    .type-move { border-left-color: #2E7D32 !important; background-color: #E8F5E9 !important; }
    .type-rec { border-left-color: #009688 !important; background-color: #E0F2F1 !important; }

    .card-header {
        padding: 12px 15px;
        display: flex;
        align-items: center;
        cursor: pointer;
        flex-wrap: wrap;
    }

    .time-box {
        font-weight: bold;
        background: #EEE;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        margin-right: 8px;
        min-width: 40px;
        text-align: center;
    }
    
    .type-move .time-box { background: #2E7D32; color: white; }

    .fare-badge {
        font-size: 11px;
        color: #555;
        background: #FFF9C4;
        padding: 2px 6px;
        border-radius: 10px;
        border: 1px solid #FBC02D;
        margin-left: auto;
        white-space: nowrap;
    }

    .card-title { flex-grow: 1; font-weight: bold; font-size: 15px; margin-right: 10px; }
    .toggle-icon { font-size: 12px; color: #999; margin-left: 5px; transition: transform 0.3s; }

    .card-details {
        display: none;
        padding: 15px;
        border-top: 1px solid #EEE;
        background-color: #FAFAFA;
    }
    .card.open .card-details { display: block; }
    .card.open .card-header .toggle-icon { transform: rotate(180deg); } 

    .desc { font-size: 14px; margin-bottom: 10px; color: #444; }
    
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .nav-btn {
        display: block; text-align: center; padding: 10px; border-radius: 6px;
        text-decoration: none; font-weight: bold; font-size: 14px;
    }
    .btn-google { background-color: #4285F4; color: white !important; }
    .btn-cheap { background-color: #2E7D32; color: white !important; }
    .btn-easy { background-color: #FF8F00; color: white !important; }
    .btn-weather { 
        background-color: #00BCD4; 
        color: white !important; 
        border: 1px solid #00ACC1;
    }

    /* --- 翻譯強化樣式 --- */
    #translator-container {
        margin: 15px;
        border: 1px solid #4285F4;
        border-radius: 8px;
        overflow: hidden;
    }
    .translator-header {
        background: #4285F4;
        color: white;
        padding: 15px;
        cursor: pointer;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .translator-content {
        padding: 15px;
        background: white;
        display: none;
    }
    #translator-container.open .translator-content { display: block; }
    
    #translation-input {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #DDD;
        border-radius: 4px;
        box-sizing: border-box;
    }
    #translate-button {
        background-color: #DB4437; /* Google 紅色 */
        color: white;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
    }
</style>

    const navContainer = document.getElementById('date-nav');
    const listContainer = document.getElementById('event-list');
    const translatorContainer = document.getElementById('translator-container'); 
    const inputField = document.getElementById('translation-input');
    const translateButton = document.getElementById('translate-button');


    // ***翻譯工具啟動函數***
    function launchTranslator() {
        const chineseText = inputField.value.trim();
        if (chineseText) {
            // Google Translate URL 格式：hl=目標語言, sl=來源語言, text=內容
            const url = `https://translate.google.com/?hl=ja&sl=zh-TW&tl=ja&text=${encodeURIComponent(chineseText)}`;
            window.open(url, '_blank');
        } else {
            alert("請先輸入您想翻譯的中文句子！");
        }
    }

    // ***新增：翻譯工具開關事件與按鈕事件***
    translatorContainer.querySelector('.translator-header').addEventListener('click', function() {
        translatorContainer.classList.toggle('open');
    });
    translateButton.addEventListener('click', launchTranslator);


    // **新的事件綁定函數**
    function bindEventListeners() {
        // 綁定卡片展開/收合事件
        document.querySelectorAll('.card-header').forEach(header => {
            header.addEventListener('click', function() {
                this.parentElement.classList.toggle('open');
            });
        });
    }

    // ***修正後的 showEvents 函數 (處理天氣連結)***
    function showEvents(index) {
        const data = tripData[index];
        
        listContainer.innerHTML = ''; 
        
        data.events.forEach(evt => {
            let typeClass = 'type-base';
            if (evt.type === 'food') typeClass = 'type-food';
            if (evt.type === 'shop') typeClass = 'type-shop';
            if (evt.type === 'move') typeClass = 'type-move';
            if (evt.type === 'rec') typeClass = 'type-rec';

            const card = document.createElement('div');
            card.className = `card ${typeClass}`;
            
            // --- 1. 處理所有按鈕 (包含天氣) ---
            let btnsHtml = '';
            let hasButtonsOrWeather = evt.buttons || evt.weatherLinkUrl;
            
            if(hasButtonsOrWeather) {
                btnsHtml = '<div class="btn-group">';

                // 處理 Google Maps/其他按鈕
                if(evt.buttons) {
                    evt.buttons.forEach(b => {
                        let btnClass = 'btn-google';
                        let linkUrl = b.url;
                        if (!linkUrl.startsWith('http')) {
                            // 預設為 Google Maps Search
                            linkUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.url)}`;
                        }
                        if(b.text.includes('省錢')) btnClass = 'btn-cheap';
                        if(b.text.includes('直達') || b.text.includes('計程車')) btnClass = 'btn-easy';
                        btnsHtml += `<a href="${linkUrl}" target="_blank" class="nav-btn ${btnClass}">${b.text}</a>`;
                    });
                }

                // 🔥 處理天氣按鈕
                if (evt.weatherLinkUrl) {
                    btnsHtml += `<a href="${evt.weatherLinkUrl}" target="_blank" class="nav-btn btn-weather">${evt.weatherLinkText || '查看天氣預報'}</a>`;
                }
                
                btnsHtml += '</div>';
            }
            // --- 結束按鈕處理 ---

            let tipsHtml = evt.tips ? `<div style="background:#E0F2F1; padding:10px; border-radius:6px; font-size:13px; color:#00695C; margin-top:8px; border:1px solid #B2DFDB;">💡 ${evt.tips}</div>` : '';
            let fareHtml = evt.fare ? `<span class="fare-badge">${evt.fare}</span>` : '';

            card.innerHTML = `
                <div class="card-header">
                    <span class="time-box">${evt.time}</span>
                    <span class="card-title">${evt.title}</span>
                    ${fareHtml}
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="card-details">
                    <div class="desc">${evt.desc}</div>
                    ${tipsHtml}
                    ${btnsHtml}
                </div>
            `;
            listContainer.appendChild(card);
        });
        // 渲染完成後，綁定所有卡片事件
        bindEventListeners();
    }

    // ***修正後的 render/switchDay 函數***
    function render() {
        tripData.forEach((day, index) => {
            const btn = document.createElement('div');
            btn.className = `date-btn ${index === 0 ? 'active' : ''}`;
            btn.textContent = day.date.split(' ')[0]; 
            
            // 綁定日期切換事件
            btn.addEventListener('click', function() {
                switchDay(index, this);
            });
            
            navContainer.appendChild(btn);
        });
        showEvents(0);
    }

    function switchDay(index, btnElement) {
        document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        showEvents(index);
    }

    render();
})();
