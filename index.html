<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTigre Travel Collection</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* --- 基礎設定 --- */
        :root {
            --text-color: #e0e0e0;
            --bg-color: #0a0a0a;
            --accent-color: #c5a059; /* 金色點綴 */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 禁止捲動，打造全屏體驗 */
            background-color: var(--bg-color);
            font-family: 'Playfair Display', serif;
            cursor: none; /* 隱藏預設滑鼠，使用自定義游標 */
        }

        /* --- 背景圖片層 --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3; /* 預設暗度 */
            transition: opacity 0.8s ease;
        }

        .bg-image {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.1s linear;
            filter: grayscale(30%) contrast(120%); /* 藝術濾鏡 */
        }

        .bg-image.active {
            opacity: 1;
        }

        /* --- 雜訊紋理 (增加底片感) --- */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.07;
            background: url('https://cdnjs.cloudflare.com/ajax/libs/shiny/0.0.1/image/noise.png');
        }

        /* --- 內容容器 --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            mix-blend-mode: exclusion; /* 讓文字與背景產生藝術融合 */
        }

        /* --- 導覽列表 --- */
        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        .nav-item {
            margin: 2vh 0;
            position: relative;
            overflow: hidden;
        }

        .nav-link {
            display: block;
            text-decoration: none;
            color: var(--text-color);
            font-size: 9vw; /* 超大文字 */
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            transition: color 0.5s ease;
            font-family: 'Playfair Display', 'Noto Serif TC', serif;
            -webkit-text-stroke: 1px rgba(255,255,255,0);
        }

        /* 懸停效果 */
        .nav-link:hover {
            -webkit-text-stroke: 1px #fff;
            color: transparent; /* 變成鏤空字體 */
        }

        .nav-subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            color: var(--accent-color);
            display: block;
            margin-top: -10px;
            font-family: 'Noto Serif TC', serif;
        }

        .nav-item:hover .nav-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- 自定義游標 --- */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
            mix-blend-mode: difference;
        }

        .cursor.hovered {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.9);
            border-color: transparent;
        }

        /* --- 裝飾線條 --- */
        .line {
            width: 1px;
            height: 0;
            background: rgba(255,255,255,0.3);
            position: absolute;
            left: 50%;
            top: 10%;
            transition: height 1.5s ease-in-out;
        }

        /* RWD 手機適配 */
        @media (max-width: 768px) {
            .nav-link { font-size: 15vw; }
            .nav-subtitle { font-size: 1rem; }
            .cursor { display: none; } /* 手機不顯示游標 */
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="bg-container" id="bgContainer"></div>
    
    <div class="noise"></div>

    <div class="line"></div>

    <div class="content-wrapper">
        <ul class="nav-list" id="navList">
        </ul>
    </div>

    <div class="cursor"></div>

<script>
    // ==========================================
    // 1. 資料設定區
    // ==========================================
    const destinations = [
        {
            name: "Tokyo",
            chinese: "東京 . 霓虹",
            url: "http://travel.itigre.com/Tokyo.html",
            image: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?q=80&w=1920&auto=format&fit=crop"
        },
        {
            name: "Okinawa",
            chinese: "沖繩 . 碧海",
            url: "http://travel.itigre.com/Okinawa.html",
            image: "https://images.unsplash.com/photo-1590523741831-ab7e8b8f9c78?q=80&w=1920&auto=format&fit=crop"
        },
        {
            name: "MSC",
            chinese: "郵輪 . 榮耀",
            url: "https://travel.itigre.com/msc/",
            image: "https://images.unsplash.com/photo-1559128010-7c1ad6e1b6a5?q=80&w=1920&auto=format&fit=crop"
        }
    ];

    // ==========================================
    // 2. 程式邏輯區
    // ==========================================
    
    const navList = document.getElementById('navList');
    const bgContainer = document.getElementById('bgContainer');
    const cursor = document.querySelector('.cursor');
    
    // 用來追蹤當前激活的索引
    let activeIndex = 0; 

    // 初始化：生成 HTML
    destinations.forEach((dest, index) => {
        // 1. 建立列表項目
        const li = document.createElement('li');
        li.className = 'nav-item';
        
        const link = document.createElement('a');
        link.className = 'nav-link';
        link.href = dest.url;
        link.innerHTML = `${dest.name} <span class="nav-subtitle">${dest.chinese}</span>`;
        
        // 綁定事件
        link.addEventListener('mouseenter', () => setActive(index));
        // 移除 mouseleave 的 clearActive，這樣滑鼠移開後，背景會停留在最後一個選擇的城市，比較美觀
        // link.addEventListener('mouseleave', () => clearActive());
        
        li.appendChild(link);
        navList.appendChild(li);

        // 2. 建立背景圖片
        const bgDiv = document.createElement('div');
        bgDiv.className = 'bg-image';
        bgDiv.style.backgroundImage = `url(${dest.image})`;
        bgContainer.appendChild(bgDiv);
    });

    const bgImages = document.querySelectorAll('.bg-image');
    const navLinks = document.querySelectorAll('.nav-link');

    // 游標跟隨邏輯
    document.addEventListener('mousemove', (e) => {
        gsap.to(cursor, {
            x: e.clientX,
            y: e.clientY,
            duration: 0.1
        });

        // 背景視差效果 (Parallax)
        const xMove = (e.clientX / window.innerWidth - 0.5) * 20;
        const yMove = (e.clientY / window.innerHeight - 0.5) * 20;

        // 只對當前顯示的背景做視差，節省效能
        gsap.to('.bg-image.active', {
            x: xMove,
            y: yMove,
            scale: 1.05,
            duration: 1
        });
    });

    // 互動狀態切換函式
    function setActive(index) {
        activeIndex = index;

        // 顯示對應背景
        bgImages.forEach((img, i) => {
            if (i === index) img.classList.add('active');
            else img.classList.remove('active');
        });

        // 游標變大
        cursor.classList.add('hovered');
        
        // 文字其餘變淡
        navLinks.forEach((link, i) => {
            if (i !== index) {
                link.style.opacity = '0.2';
                link.style.webkitTextStroke = '1px rgba(255,255,255,0)'; // 還原邊框
                link.style.color = 'var(--text-color)'; // 還原顏色
            } else {
                link.style.opacity = '1';
                // 這裡交給 CSS hover 處理顏色，JS 只要負責透明度
            }
        });
    }

    // (選用) 離開導覽列區域時，可以選擇是否要還原
    navList.addEventListener('mouseleave', () => {
         cursor.classList.remove('hovered');
         navLinks.forEach(link => link.style.opacity = '1');
    });

    // 入場動畫與初始狀態
    window.onload = () => {
        document.querySelector('.line').style.height = '80%';
        
        // ★ 重點修改：網頁載入後，預設顯示第一張圖，避免一片黑
        setActive(0);
        // 手動移除 hover 狀態，讓字體先保持白色實心，直到使用者真正去滑動
        cursor.classList.remove('hovered'); 
        navLinks.forEach(link => link.style.opacity = '1');

        gsap.from('.nav-item', {
            y: 100,
            opacity: 0,
            duration: 1.5,
            stagger: 0.2,
            ease: "power4.out"
        });
    };
</script>

</body>
</html>
