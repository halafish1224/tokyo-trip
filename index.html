        color: #9E9E9E; /* 灰色文字 */

    }
    #tokyo-fare-container .date-btn.today-date {

    }
    .conversion-box {
        background: #FFF;
        padding: 15px;
        border-radius: 6px;
        border: 1px solid #C8E6C9;
    }
    .conversion-box label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.95em;
        font-weight: bold;
        color: #4CAF50;
    }
    .conversion-input {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #A5D6A7;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1.2em;
        text-align: right;
    }
    .conversion-output {
        padding: 10px;
        background: #F1F8E9;
        border-radius: 4px;
        font-size: 1.1em;
        font-weight: bold;
        color: #3E2723;
        margin-top: 10px;
    }
    .conversion-output span {
        font-weight: normal;
        color: #1B5E20;
    }

    /* --- 核心樣式 --- (保持不變) */
    #tokyo-fare-container {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #FFFBF0;
        color: #3E2723;
        max-width: 100%;
        margin: 0 auto;
        padding-bottom: 60px;
        border-radius: 8px;
        line-height: 1.6;
        box-sizing: border-box;
    }

    #tokyo-fare-container header {
        background: linear-gradient(135deg, #C62828, #B71C1C);
        color: #FFF;
        padding: 20px 15px;
        text-align: center;
        border-radius: 8px 8px 0 0;
    }

    /* --- 日期導航 --- */
    #tokyo-fare-container .date-nav {
        padding: 5px 10px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-bottom: 10px;
    }
    
    #tokyo-fare-container .date-btn {
        flex: 0 0 auto;
        padding: 10px 5px;
        border-radius: 6px;
        border: 1px solid #E0E0E0;
        background: #FFFFFF;
        color: #555;
        font-size: 13px;
        cursor: pointer;
        width: calc(20% - 6px);
        text-align: center;
        font-weight: bold;
        transition: all 0.2s; /* 添加過渡效果 */
    }
    
    @media (max-width: 400px) { #tokyo-fare-container .date-btn { width: calc(25% - 6px); } }

    #tokyo-fare-container .date-btn.active:not(.today-date) {
        background: #C62828;
        color: white;
        border-color: #C62828;
    }
    #tokyo-fare-container .date-btn.active.today-date {
        /* 當日被選中時，維持 today-date 的樣式，更醒目 */
        background: #C62828;
        color: white;
        border: 2px solid #C62828;
    }

    #tokyo-fare-container .card {
        background: #FFF;
        border-radius: 8px;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        border-left: 5px solid #999;
        overflow: hidden;

    .type-shop { border-left-color: #6A1B9A !important; } 
    .type-move { border-left-color: #2E7D32 !important; background-color: #E8F5E9 !important; }
    .type-rec { border-left-color: #009688 !important; background-color: #E0F2F1 !important; }

        padding: 12px 15px;
        display: flex;
        align-items: center;
        cursor: pointer;
        flex-wrap: wrap;
    }

    .time-box {
        font-weight: bold;
        background: #EEE;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        margin-right: 8px;
        min-width: 40px;
        text-align: center;
    }

        font-size: 11px;
        color: #555;
        background: #FFF9C4;
        padding: 2px 6px;
        border-radius: 10px;
        border: 1px solid #FBC02D;
        margin-left: auto;
        white-space: nowrap;
    }

    .toggle-icon { font-size: 12px; color: #999; margin-left: 5px; transition: transform 0.3s; }

        display: none;
        padding: 15px;
        border-top: 1px solid #EEE;
        background-color: #FAFAFA;
    }
    .card.open .card-details { display: block; }
    .card.open .card-header .toggle-icon { transform: rotate(180deg); } 

    .desc { font-size: 14px; margin-bottom: 10px; color: #444; }
    
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .nav-btn {
        display: block; text-align: center; padding: 10px; border-radius: 6px;

    }
    .btn-google { background-color: #4285F4; color: white !important; }

    .btn-easy { background-color: #FF8F00; color: white !important; }
    .btn-weather {

        color: white !important;

    }

        margin: 15px;
        border: 1px solid #4285F4;
        border-radius: 8px;
        overflow: hidden;

        color: white;

        cursor: pointer;
        font-weight: bold;
        display: flex;
        justify-content: space-between;

    .translator-content {
        padding: 15px;
        background: white;
        display: none;
    }

        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #DDD;
        border-radius: 4px;
        box-sizing: border-box;

        color: white;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-weight: bold;

    const navContainer = document.getElementById('date-nav');
    const listContainer = document.getElementById('event-list');
    const translatorContainer = document.getElementById('translator-container'); 
    const inputField = document.getElementById('translation-input');
    const translateButton = document.getElementById('translate-button');

    // **輔助函數：日期處理**
    function normalizeDate(date) {
        // 確保日期是午夜 (00:00:00) 以便精確比較
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    // ***翻譯工具啟動函數***
    function launchTranslator() {
        const chineseText = inputField.value.trim();
        if (chineseText) {
            const url = `https://translate.google.com/?hl=ja&sl=zh-TW&tl=ja&text=${encodeURIComponent(chineseText)}`; 
            window.open(url, '_blank');
        } else {
            alert("請先輸入您想翻譯的中文句子！");
        }
    }

    // ***翻譯工具開關事件與按鈕事件***
    translatorContainer.querySelector('.translator-header').addEventListener('click', function() {
        translatorContainer.classList.toggle('open');
    });
    translateButton.addEventListener('click', launchTranslator);


    // **事件綁定函數**
    function bindEventListeners() {
        // 綁定卡片展開/收合事件
        document.querySelectorAll('.card-header').forEach(header => {
            header.addEventListener('click', function() {
                this.parentElement.classList.toggle('open');
            });
        });
    }

    // ***showEvents 函數 (處理行程渲染)***
    function showEvents(index) {
        const data = tripData[index];
        
        listContainer.innerHTML = ''; 
        
        data.events.forEach(evt => {
            let typeClass = 'type-base';
            if (evt.type === 'food') typeClass = 'type-food';
            if (evt.type === 'shop') typeClass = 'type-shop';
            if (evt.type === 'move') typeClass = 'type-move';
            if (evt.type === 'rec') typeClass = 'type-rec';

            const card = document.createElement('div');
            card.className = `card ${typeClass}`;
            
            let btnsHtml = '';
            let hasButtonsOrWeather = evt.buttons || evt.weatherLinkUrl;
            
            if(hasButtonsOrWeather) {
                btnsHtml = '<div class="btn-group">';

                // 處理 Google Maps/其他按鈕
                if(evt.buttons) {
                    evt.buttons.forEach(b => {
                        let btnClass = 'btn-google';
                        let linkUrl = b.url;
                        if(b.url.startsWith('https://www.google.com/maps')) {
                            // URL 已經是 Google Maps 導航連結
                        } else if (!linkUrl.startsWith('http')) {
                            // 預設為 Google Maps 搜尋
                            linkUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.url)}`;
                        }
                        
                        if(b.text.includes('省錢')) btnClass = 'btn-cheap';
                        if(b.text.includes('直達') || b.text.includes('計程車')) btnClass = 'btn-easy';
                        btnsHtml += `<a href="${linkUrl}" target="_blank" class="nav-btn ${btnClass}">${b.text}</a>`;
                    });
                }

                // 處理天氣按鈕
                if (evt.weatherLinkUrl) {
                    btnsHtml += `<a href="${evt.weatherLinkUrl}" target="_blank" class="nav-btn btn-weather">${evt.weatherLinkText || '查看天氣預報'}</a>`;
                }
                
                btnsHtml += '</div>';
            }

            let tipsHtml = evt.tips ? `<div style="background:#E0F2F1; padding:10px; border-radius:6px; font-size:13px; color:#00695C; margin-top:8px; border:1px solid #B2DFDB;">💡 ${evt.tips}</div>` : '';
            let fareHtml = evt.fare ? `<span class="fare-badge">${evt.fare}</span>` : '';

            card.innerHTML = `
                <div class="card-header">
                    <span class="time-box">${evt.time}</span>
                    <span class="card-title">${evt.title}</span>
                    ${fareHtml}
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="card-details">
                    <div class="desc">${evt.desc}</div>
                    ${tipsHtml}
                    ${btnsHtml}
                </div>
            `;
            listContainer.appendChild(card);
        });
        // 渲染完成後，綁定所有卡片事件
        bindEventListeners();
    }

    // ***switchDay 函數***
    function switchDay(index, btnElement) {
        document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
        
        // 只有非過去的日期可以被點擊為 active
        if (!btnElement.classList.contains('past-date')) {
            btnElement.classList.add('active');
        }
        
        showEvents(index);
    }

    // ***render 函數 (包含日期判斷邏輯)***
    function render() {
        const today = normalizeDate(new Date());
        let initialActiveIndex = 0; 
        let foundActiveDay = false; // 確保只設定第一個 >= 今天 的日期為 active

        tripData.forEach((day, index) => {
            // 由於行程標題是 2025 年，我們假設行程年為 2025
            const year = 2025;
            const dateParts = day.date.match(/(\d+)\/(\d+)/);
            const month = parseInt(dateParts[1], 10) - 1; // 月份從 0 開始
            const dayOfMonth = parseInt(dateParts[2], 10);
            
            // 建立行程日期物件 (午夜)
            const itineraryDate = normalizeDate(new Date(year, month, dayOfMonth));

            const btn = document.createElement('div');
            btn.textContent = day.date.split(' ')[0]; 
            btn.className = 'date-btn';
            
            // --- 日期狀態判斷 ---
            if (itineraryDate < today) {
                // 過去的日期
                btn.classList.add('past-date');
            } else if (itineraryDate.getTime() === today.getTime()) {
                // 當天日期
                btn.classList.add('today-date');
                initialActiveIndex = index;
                foundActiveDay = true;
            } else if (itineraryDate > today && !foundActiveDay) {
                // 第一個未來的日期 (如果今天不在行程內或今天已過)
                initialActiveIndex = index;
                foundActiveDay = true;
            }

            // 綁定日期切換事件
            btn.addEventListener('click', function() {
                switchDay(index, this);
            });
            
            navContainer.appendChild(btn);
        });

        // 檢查如果今天已在行程之後 (例如 12/28)，則預設選擇最後一天
        if (!foundActiveDay && today > normalizeDate(new Date(2025, 11, 27))) { 
            initialActiveIndex = tripData.length - 1;
        }

        // 設置正確的初始 active 按鈕
        const activeBtn = navContainer.children[initialActiveIndex];
        if (activeBtn) {
            activeBtn.classList.add('active');
        }
        
        showEvents(initialActiveIndex); // 載入該日期的行程
    }

    render();

    // === 簡化後的匯率功能 (TWD:JPY 獲取與 JPY:TWD 轉換) ===
    let currentRate = 4.5000; // 備用匯率：1 TWD = 4.50 JPY
    const rateElement = document.getElementById('exchange-rate-value');
    const jpyInputElement = document.getElementById('jpy-input');
    const twdResultElement = document.getElementById('twd-result');

    // 1. 匯率獲取 (從 TWD 查 JPY)
    function fetchExchangeRate() {
        const apiUrl = 'https://api.exchangerate-api.com/v4/latest/TWD'; 

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                if (data.rates && data.rates.JPY) {
                    currentRate = data.rates.JPY; // 1 TWD 可以兌換多少 JPY
                    rateElement.textContent = currentRate.toFixed(4);
                    convertJpyToTwd();
                }
            })
            .catch(error => {
                console.error("無法獲取即時匯率，使用備用值 4.5000:", error);
                rateElement.textContent = `${currentRate.toFixed(4)} (無法更新)`;
            });
    }

    // 2. 日幣轉台幣換算邏輯
    function convertJpyToTwd() {
        // JPY/TWD 的匯率 = 1 / TWD/JPY 的匯率
        const rateJPYtoTWD = 1 / currentRate; 
        
        const jpyAmount = parseFloat(jpyInputElement.value) || 0;

        if (jpyAmount > 0) {
            // JPY 金額 * (1/TWD_JPY_Rate)
            const twdAmount = jpyAmount * rateJPYtoTWD;
            // 格式化為台幣顯示 (逗號分隔，小數點後兩位)
            twdResultElement.textContent = twdAmount.toLocaleString('zh-TW', { maximumFractionDigits: 2 });
        } else {
            twdResultElement.textContent = '0';
        }
    }

    // 3. 綁定輸入事件
    jpyInputElement.addEventListener('input', convertJpyToTwd);

    // 啟動功能
    fetchExchangeRate();

})();
