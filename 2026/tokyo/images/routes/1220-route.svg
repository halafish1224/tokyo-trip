<title id="title">12/20 東京站・銀座・汐留 行進路線圖</title><desc id="desc">北朝上，景點位置依近似座標等比例配置；北東側浜町出發，到東京站與KITTE，再往南到銀座、汐留，晚間北返丸善與浜町。銀座附獨立放大圖。連線為移動示意，非逐街導航。</desc>
