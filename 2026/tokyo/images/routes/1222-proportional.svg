<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1380" viewBox="0 0 1100 1380" role="img" aria-labelledby="title desc"><title id="title">12/22 築地本願寺 → 市場午餐，東橫INN新大橋出發與返回</title><desc id="desc">北朝上，地點按相對位置與比例繪製；右側按當日次序列出停留點。直線箭頭是交通關係示意，不是鐵道路線或步行導航。神社可選；主圖為跨區，放大框為築地。線段不是步行路徑；一家大小可短程計程車，不繞東京站。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><style>text{font-family:system-ui,"Noto Sans TC",sans-serif} .node{font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle;fill:white} .track{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)} .out{stroke:#145b53}.home{stroke:#b45a21;stroke-dasharray:11 9}.a{stroke:#714095}.b{stroke:#18729a}.candidate{stroke:#8d6a22;stroke-dasharray:4 9}</style><rect width="1100" height="1380" fill="#fffaf0"/><rect x="25" y="20" width="1050" height="1340" rx="20" fill="#fffaf0" stroke="#7e9b8b" stroke-width="3"/><text x="58" y="75" font-size="34" fill="#183c36" font-weight="800">12/22  路徑與相對位置 · 築地本願寺 → 市場午餐</text><text x="58" y="120" font-size="19" fill="#183c36" font-weight="600">北朝上 · 位置等比例 · 箭頭表示先後與方向</text><rect x="55" y="160" width="635" height="725" rx="14" fill="#eff4eb" stroke="#a8b8a7" stroke-width="2"/><rect x="724" y="160" width="320" height="725" rx="14" fill="#fff" stroke="#a8b8a7" stroke-width="2"/><text x="750" y="200" font-size="23" fill="#183c36" font-weight="800">當日順序／搭車方向</text><path d="M58 250H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 350H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 450H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 550H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 650H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 750H687" stroke="#d4dfd3" stroke-width="1"/><path d="M534.0 245.2L228.0 723.1" class="track out"/><path d="M202.3 770.4L209.9 752.7" class="track out"/><path d="M198.7 804.3L198.3 790.0" class="track candidate"/><path d="M198.5 796.0L198.9 810.2" class="track candidate"/><path d="M215.0 762.6L535.3 253.1" class="track home"/><circle cx="547.0" cy="225.0" r="24" fill="#763c19" stroke="#fff" stroke-width="4"/><text x="547.0" y="226.0" class="node" font-size="18">宿</text><circle cx="211.8" cy="748.4" r="24" fill="#145b53" stroke="#fff" stroke-width="4"/><text x="211.8" y="749.4" class="node" font-size="18">1</text><circle cx="198.0" cy="780.3" r="24" fill="#145b53" stroke="#fff" stroke-width="4"/><text x="198.0" y="781.3" class="node" font-size="18">2</text><circle cx="199.2" cy="820.0" r="24" fill="#8d6a22" stroke="#fff" stroke-width="4"/><text x="199.2" y="821.0" class="node" font-size="18">?</text><path d="M82 845h223.7m-223.7-9v18m223.7-18v18" stroke="#163f37" stroke-width="4" fill="none"/><text x="317" y="852" font-size="18" fill="#183c36" font-weight="600">1 km</text><path d="M650 230v-40l-10 16m10-16l10 16" stroke="#163f37" stroke-width="3" fill="none"/><text x="628" y="255" font-size="18" fill="#183c36" font-weight="600">北 N</text><rect x="746" y="217" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="241" r="17" fill="#145b53"/><text x="768" y="241" class="node" font-size="15">0</text><text x="793" y="239" font-size="19" fill="#183c36" font-weight="800">東橫INN 新大橋</text><text x="793" y="267" font-size="15" fill="#40534b" font-weight="500">跨區搭車到築地</text><rect x="746" y="297" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="321" r="17" fill="#145b53"/><text x="768" y="321" class="node" font-size="15">1</text><text x="793" y="319" font-size="19" fill="#183c36" font-weight="800">築地本願寺</text><text x="793" y="347" font-size="15" fill="#40534b" font-weight="500">建築與石雕，免費參觀</text><rect x="746" y="377" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="401" r="17" fill="#145b53"/><text x="768" y="401" class="node" font-size="15">2</text><text x="793" y="399" font-size="19" fill="#183c36" font-weight="800">魚河岸小田原橋棟</text><text x="793" y="427" font-size="15" fill="#40534b" font-weight="500">市場慢逛／3F熟食午餐</text><rect x="746" y="457" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="481" r="17" fill="#145b53"/><text x="768" y="481" class="node" font-size="15">?</text><text x="793" y="479" font-size="19" fill="#183c36" font-weight="800">波除神社</text><text x="793" y="507" font-size="15" fill="#40534b" font-weight="500">可選短程參拜，累了略過</text><rect x="746" y="537" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="561" r="17" fill="#145b53"/><text x="768" y="561" class="node" font-size="15">4</text><text x="793" y="559" font-size="19" fill="#183c36" font-weight="800">魚河岸食堂</text><text x="793" y="587" font-size="15" fill="#40534b" font-weight="500">咖啡歇腳後搭車</text><rect x="746" y="617" width="277" height="70" rx="8" fill="#fff2e7"/><circle cx="768" cy="641" r="17" fill="#b45a21"/><text x="768" y="641" class="node" font-size="15">終</text><text x="793" y="639" font-size="19" fill="#183c36" font-weight="800">東橫INN 新大橋</text><text x="793" y="667" font-size="15" fill="#40534b" font-weight="500">短程計程車回飯店</text><rect x="55" y="935" width="990" height="348" rx="14" fill="#f1f5ee" stroke="#a8b8a7" stroke-width="2"/><text x="78" y="975" font-size="23" fill="#183c36" font-weight="800">局部放大 · 本框另有比例尺</text><path d="M382.7 1026.5L347.0 1108.8" stroke="#145b53" stroke-width="3" fill="none" stroke-dasharray="5 5"/><path d="M347.0 1108.8L350.0 1211.5" stroke="#145b53" stroke-width="3" fill="none" stroke-dasharray="5 5"/><circle cx="382.7" cy="1026.5" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="382.7" y="1027.5" class="node" font-size="13">1</text><text x="704" y="1042" font-size="20" fill="#183c36" font-weight="800">1 築地本願寺</text><circle cx="347.0" cy="1108.8" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="347.0" y="1109.8" class="node" font-size="13">2</text><text x="704" y="1089" font-size="20" fill="#183c36" font-weight="800">2 魚河岸小田原橋棟</text><circle cx="350.0" cy="1211.5" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="350.0" y="1212.5" class="node" font-size="13">?</text><text x="704" y="1136" font-size="20" fill="#183c36" font-weight="800">? 波除神社</text><path d="M88 1235h57.8m-57.8-6v12m57.8-12v12" stroke="#163f37" stroke-width="3" fill="none"/><text x="160" y="1242" font-size="17" fill="#183c36" font-weight="600">100 m</text><text x="58" y="1305" font-size="17" fill="#183c36" font-weight="600">● 飯店：出發與終點　 ━ 去程／同日次序　 ┄ 橘色：搭車回飯店</text><text x="58" y="1330" font-size="16" fill="#183c36" font-weight="600">直線不是軌道／步行距離；車次、出口與活動入口須當日確認。</text></svg>