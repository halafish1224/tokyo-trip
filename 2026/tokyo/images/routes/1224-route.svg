ext><text x="65" y="1690" class="tiny">上圖看東京／越谷遠近，下圖看商場；兩個比例尺不可混用。</text><text x="65" y="1720" class="tiny">mori標示館區中心；餐廳門口另看樓層圖。</text><text x="65" y="1750" class="tiny">20:00 浜町晚餐；回程交通與時間請另查。</text></svg>