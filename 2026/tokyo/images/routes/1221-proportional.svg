<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1380" viewBox="0 0 1100 1380" role="img" aria-labelledby="title desc"><title id="title">12/21 柴又／豐洲分流 → 芝公園，東橫INN新大橋出發與返回</title><desc id="desc">北朝上，地點按相對位置與比例繪製；右側按當日次序列出停留點。直線箭頭是交通關係示意，不是鐵道路線或步行導航。A／B 同時分流，草坪與市集在同區但非同一點；東京站線是接駁替代回程，原表亦有御成門→神保町→浜町。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><style>text{font-family:system-ui,"Noto Sans TC",sans-serif} .node{font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle;fill:white} .track{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)} .out{stroke:#145b53}.home{stroke:#b45a21;stroke-dasharray:11 9}.a{stroke:#714095}.b{stroke:#18729a}.candidate{stroke:#8d6a22;stroke-dasharray:4 9}</style><rect width="1100" height="1380" fill="#fffaf0"/><rect x="25" y="20" width="1050" height="1340" rx="20" fill="#fffaf0" stroke="#7e9b8b" stroke-width="3"/><text x="58" y="75" font-size="34" fill="#183c36" font-weight="800">12/21  路徑與相對位置 · 柴又／豐洲分流 → 芝公園</text><text x="58" y="120" font-size="19" fill="#183c36" font-weight="600">北朝上 · 位置等比例 · 箭頭表示先後與方向</text><rect x="55" y="160" width="635" height="725" rx="14" fill="#eff4eb" stroke="#a8b8a7" stroke-width="2"/><rect x="724" y="160" width="320" height="725" rx="14" fill="#fff" stroke="#a8b8a7" stroke-width="2"/><text x="750" y="200" font-size="23" fill="#183c36" font-weight="800">當日順序／搭車方向</text><path d="M58 250H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 350H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 450H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 550H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 650H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 750H687" stroke="#d4dfd3" stroke-width="1"/><path d="M300.7 585.2L608.7 281.0" class="track a"/><path d="M284.0 626.1L286.1 755.1" class="track b"/><path d="M612.7 276.6L136.6 736.2" class="track a"/><path d="M262.9 781.2L144.6 761.8" class="track b"/><path d="M137.9 730.5L127.6 757.5" class="track out"/><path d="M155.3 711.8L188.0 659.5" class="track home"/><path d="M224.0 628.2L256.9 616.7" class="track home"/><circle cx="283.6" cy="602.1" r="24" fill="#763c19" stroke="#fff" stroke-width="4"/><text x="283.6" y="603.1" class="node" font-size="18">宿</text><circle cx="630.0" cy="259.9" r="24" fill="#714095" stroke="#fff" stroke-width="4"/><text x="630.0" y="260.9" class="node" font-size="18">A</text><circle cx="286.6" cy="785.1" r="24" fill="#18729a" stroke="#fff" stroke-width="4"/><text x="286.6" y="786.1" class="node" font-size="18">B</text><circle cx="115.0" cy="757.0" r="24" fill="#145b53" stroke="#fff" stroke-width="4"/><text x="115.0" y="758.0" class="node" font-size="18">3</text><circle cx="129.3" cy="752.9" r="24" fill="#145b53" stroke="#fff" stroke-width="4"/><text x="129.3" y="753.9" class="node" font-size="18">4</text><circle cx="138.3" cy="729.5" r="24" fill="#145b53" stroke="#fff" stroke-width="4"/><text x="138.3" y="730.5" class="node" font-size="18">5</text><circle cx="199.7" cy="631.4" r="24" fill="#145b53" stroke="#fff" stroke-width="4"/><text x="199.7" y="632.4" class="node" font-size="18">東京</text><path d="M82 845h214.6m-214.6-9v18m214.6-18v18" stroke="#163f37" stroke-width="4" fill="none"/><text x="308" y="852" font-size="18" fill="#183c36" font-weight="600">5 km</text><path d="M650 230v-40l-10 16m10-16l10 16" stroke="#163f37" stroke-width="3" fill="none"/><text x="628" y="255" font-size="18" fill="#183c36" font-weight="600">北 N</text><rect x="746" y="217" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="241" r="17" fill="#145b53"/><text x="768" y="241" class="node" font-size="15">0</text><text x="793" y="239" font-size="19" fill="#183c36" font-weight="800">東橫INN 新大橋</text><text x="793" y="267" font-size="15" fill="#40534b" font-weight="500">兩組從飯店分流</text><rect x="746" y="297" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="321" r="17" fill="#145b53"/><text x="768" y="321" class="node" font-size="15">A</text><text x="793" y="319" font-size="19" fill="#183c36" font-weight="800">A 柴又</text><text x="793" y="347" font-size="15" fill="#40534b" font-weight="500">帝釋天／高木屋一帶</text><rect x="746" y="377" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="401" r="17" fill="#145b53"/><text x="768" y="401" class="node" font-size="15">B</text><text x="793" y="399" font-size="19" fill="#183c36" font-weight="800">B 豐洲</text><text x="793" y="427" font-size="15" fill="#40534b" font-weight="500">teamLab 一帶</text><rect x="746" y="457" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="481" r="17" fill="#145b53"/><text x="768" y="481" class="node" font-size="15">3</text><text x="793" y="479" font-size="19" fill="#183c36" font-weight="800">赤羽橋站</text><text x="793" y="507" font-size="15" fill="#40534b" font-weight="500">兩組會合</text><rect x="746" y="537" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="561" r="17" fill="#145b53"/><text x="768" y="561" class="node" font-size="15">4</text><text x="793" y="559" font-size="19" fill="#183c36" font-weight="800">芝公園草坪</text><text x="793" y="587" font-size="15" fill="#40534b" font-weight="500">只留草坪休息點</text><rect x="746" y="617" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="641" r="17" fill="#145b53"/><text x="768" y="641" class="node" font-size="15">5</text><text x="793" y="639" font-size="19" fill="#183c36" font-weight="800">御成門市集</text><text x="793" y="667" font-size="15" fill="#40534b" font-weight="500">市集入口依票券核對</text><rect x="746" y="697" width="277" height="70" rx="8" fill="#f4f7f2"/><circle cx="768" cy="721" r="17" fill="#145b53"/><text x="768" y="721" class="node" font-size="15">6</text><text x="793" y="719" font-size="19" fill="#183c36" font-weight="800">東京站</text><text x="793" y="747" font-size="15" fill="#40534b" font-weight="500">接駁替代回程</text><rect x="746" y="777" width="277" height="70" rx="8" fill="#fff2e7"/><circle cx="768" cy="801" r="17" fill="#b45a21"/><text x="768" y="801" class="node" font-size="15">終</text><text x="793" y="799" font-size="19" fill="#183c36" font-weight="800">東橫INN 新大橋</text><text x="793" y="827" font-size="15" fill="#40534b" font-weight="500">回到同一飯店</text><rect x="55" y="935" width="990" height="348" rx="14" fill="#f1f5ee" stroke="#a8b8a7" stroke-width="2"/><text x="78" y="975" font-size="23" fill="#183c36" font-weight="800">局部放大 · 本框另有比例尺</text><path d="M294.6 1211.5L391.1 1184.3" stroke="#145b53" stroke-width="3" fill="none" stroke-dasharray="5 5"/><path d="M391.1 1184.3L451.4 1026.5" stroke="#145b53" stroke-width="3" fill="none" stroke-dasharray="5 5"/><circle cx="294.6" cy="1211.5" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="294.6" y="1212.5" class="node" font-size="13">3</text><text x="704" y="1042" font-size="20" fill="#183c36" font-weight="800">3 赤羽橋站</text><circle cx="391.1" cy="1184.3" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="391.1" y="1185.3" class="node" font-size="13">4</text><text x="704" y="1089" font-size="20" fill="#183c36" font-weight="800">4 芝公園草坪</text><circle cx="451.4" cy="1026.5" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="451.4" y="1027.5" class="node" font-size="13">5</text><text x="704" y="1136" font-size="20" fill="#183c36" font-weight="800">5 御成門市集</text><path d="M88 1235h57.7m-57.7-6v12m57.7-12v12" stroke="#163f37" stroke-width="3" fill="none"/><text x="160" y="1242" font-size="17" fill="#183c36" font-weight="600">200 m</text><text x="58" y="1305" font-size="17" fill="#183c36" font-weight="600">● 飯店：出發與終點　 ━ 去程／同日次序　 ┄ 橘色：東京站接駁回程</text><text x="58" y="1330" font-size="16" fill="#183c36" font-weight="600">直線不是軌道／步行距離；車次、出口與活動入口須當日確認。</text></svg>