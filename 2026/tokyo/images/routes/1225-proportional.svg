<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1380" viewBox="0 0 1100 1380" role="img" aria-labelledby="title desc"><title id="title">12/25 淺草 → 上野，東橫INN新大橋出發與返回</title><desc id="desc">北朝上，地點按相對位置與比例繪製；右側按當日次序列出停留點。直線箭頭是交通關係示意，不是鐵道路線或步行導航。ROX 在淺草寺西南，上野更往西；田原町→上野為銀座線，圖線並非鐵道形狀。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><style>text{font-family:system-ui,"Noto Sans TC",sans-serif} .node{font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle;fill:white} .track{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)} .out{stroke:#145b53}.home{stroke:#b45a21;stroke-dasharray:11 9}.a{stroke:#714095}.b{stroke:#18729a}.candidate{stroke:#8d6a22;stroke-dasharray:4 9}</style><rect width="1100" height="1380" fill="#fffaf0"/><rect x="25" y="20" width="1050" height="1340" rx="20" fill="#fffaf0" stroke="#7e9b8b" stroke-width="3"/><text x="58" y="75" font-size="34" fill="#183c36" font-weight="800">12/25  路徑與相對位置 · 淺草 → 上野</text><text x="58" y="120" font-size="19" fill="#183c36" font-weight="600">北朝上 · 位置等比例 · 箭頭表示先後與方向</text><rect x="55" y="160" width="635" height="725" rx="14" fill="#eff4eb" stroke="#a8b8a7" stroke-width="2"/><rect x="724" y="160" width="320" height="725" rx="14" fill="#fff" stroke="#a8b8a7" stroke-width="2"/><text x="750" y="200" font-size="23" fill="#183c36" font-weight="800">當日順序／搭車方向</text><path d="M58 250H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 350H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 450H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 550H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 650H687" stroke="#d4dfd3" stroke-width="1"/><path d="M58 750H687" stroke="#d4dfd3" stroke-width="1"/><path d="M445.7 687.9L611.1 253.0" class="track out"/><path d="M598.3 230.4L524.7 247.3" class="track out"/><path d="M471.