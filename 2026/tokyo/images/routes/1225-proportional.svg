roke-width="3"/><text x="458.2" y="1114.4" class="node" font-size="13">2</text><text x="704" y="1089" font-size="20" fill="#183c36" font-weight="800">2 淺草 ROX</text><circle cx="108.0" cy="1165.9" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="108.0" y="1166.9" class="node" font-size="13">3</text><text x="704" y="1136" font-size="20" fill="#183c36" font-weight="800">3 上野／阿美橫</text><path d="M88 1235h45.7m-45.7-6v12m45.7-12v12" stroke="#163f37" stroke-width="3" fill="none"/><text x="148" y="1242" font-size="17" fill="#183c36" font-weight="600">200 m</text><text x="58" y="1305" font-size="17" fill="#183c36" font-weight="600">● 飯店：出發與終點　 ━ 去程／同日次序　 ┄ 橘色：東京站接駁回程</text><text x="58" y="1330" font-size="16" fill="#183c36" font-weight="600">直線不是軌道／步行距離；車次、出口與活動入口須當日確認。</text></svg>