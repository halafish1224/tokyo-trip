#183c36" font-weight="800">2 銀座商場</text><circle cx="341.3" cy="1211.5" r="14" fill="#145b53" stroke="#fff" stroke-width="3"/><text x="341.3" y="1212.5" class="node" font-size="13">3</text><text x="704" y="1136" font-size="20" fill="#183c36" font-weight="800">3 新橋・汐留大時計</text><path d="M88 1235h47.6m-47.6-6v12m47.6-12v12" stroke="#163f37" stroke-width="3" fill="none"/><text x="150" y="1242" font-size="17" fill="#183c36" font-weight="600">500 m</text><text x="58" y="1305" font-size="17" fill="#183c36" font-weight="600">● 飯店：出發與終點　 ━ 去程／同日次序　 ┄ 橘色：東京站接駁回程</text><text x="58" y="1330" font-size="16" fill="#183c36" font-weight="600">直線不是軌道／步行距離；車次、出口與活動入口須當日確認。</text></svg>