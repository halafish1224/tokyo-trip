<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="東京2026">
    <title>東京冬日紀行 2026 | 家族回憶版 (含長輩友善升級)</title>
    <meta name="theme-color" content="#1A374D">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-overlay: rgba(253, 251, 247, 0.92);
            --card-bg: #FFFFFF;
            --text-main: #2c3e50;
            --text-sub: #555555;
            --theme-blue: #2980b9;
            --theme-orange: #e67e22;
            --theme-green: #27ae60;
            --theme-red: #c0392b;
            --color-gold: #d35400;
            --color-pink: #e84393;
            --color-alt: #7b2d8b;
            --color-elder: #00897B;
            --color-dark-grey: #1A374D;
            --gemini-gradient: linear-gradient(135deg, #4285F4, #9B72CB, #D96570);
            --hand-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            --hand-border: 2px solid #2c3e50;
            --hand-shadow: 4px 4px 0px rgba(44, 62, 80, 0.15);
        }

        html { font-size: 100%; transition: font-size 0.2s ease; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; word-break: break-word; }

        body {
            font-family: 'Klee One', 'Noto Sans TC', sans-serif;
            margin: 0; 
            /* 優化：加入底部安全區 (Safe Area) 適應底線手勢 */
            padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
            line-height: 1.6;
            color: var(--text-main); min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-overlay); z-index: -1; backdrop-filter: blur(4px);
        }

        header {
            background: rgba(253, 251, 247, 0.96);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 2px dashed #2c3e50;
            backdrop-filter: blur(10px);
            /* 優化：加入頂部安全區 (Safe Area) 避開瀏海/動態島 */
            padding-top: env(safe-area-inset-top);
        }

        .header-inner { max-width: 800px; margin: 0 auto; padding: 12px 15px 0; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

        .top-title {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.2rem;
            color: var(--color-dark-grey); font-weight: 900;
        }
        .top-title span.year { color: var(--color-gold); margin-left: 4px; }

        .project-tabs { display: flex; gap: 6px; flex-shrink: 0; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .project-tabs::-webkit-scrollbar { display: none; }
        .project-tab {
            border: var(--hand-border); border-radius: var(--hand-radius); background: transparent;
            font-size: 0.8rem; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-weight: 600;
            color: var(--text-main);
        }
        .project-tab.active { background: var(--color-dark-grey); color: #fff; box-shadow: 2px 2px 0px rgba(0,0,0,0.2); }

        .top-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .header-rate {
            font-size: 0.8rem; color: #fff; background: var(--theme-green);
            padding: 4px 10px; border-radius: 20px; font-weight: bold;
            border: var(--hand-border); box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .project-nav-row { max-width: 800px; margin: 0 auto; padding: 8px 15px 12px; }
        .date-scroller { display: none; overflow-x: auto; padding-bottom: 5px; gap: 10px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-scroller.active { display: flex; }

        .date-chip {
            flex: 0 0 auto; width: 75px; height: 50px;
            border-radius: 8px; font-size: 0.9rem; font-weight: 900; cursor: pointer;
            transition: all 0.2s; border: var(--hand-border); display: flex; align-items: center; justify-content: center;
            color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); background-size: cover; background-position: center;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2); position: relative; overflow: hidden; background-color: #7f8c8d;
        }
        .date-chip::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.3); z-index: 0; }
        .date-chip span { z-index: 1; position: relative; }
        .date-chip.active { border-color: var(--color-gold); transform: translateY(-3px); box-shadow: 4px 4px 0px var(--color-gold); }

        .container { padding: 20px 15px; max-width: 600px; margin: 0 auto; }

        .font-control-panel {
            background: #fff; padding: 12px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px;
            border: var(--hand-border); border-radius: var(--hand-radius); box-shadow: var(--hand-shadow);
        }
        .font-btn { background: #fdfbf7; border: var(--hand-border); border-radius: 8px; padding: 6px 16px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .font-display { font-weight: bold; color: var(--color-dark-grey); min-width: 60px; text-align: center; }

        .day-section { background: #fff; overflow: hidden; margin-bottom: 35px; border: var(--hand-border); border-radius: 8px; box-shadow: var(--hand-shadow); }
        .day-cover-img { width: 100%; height: 160px; object-fit: cover; display: block; border-bottom: 2px solid #2c3e50; }
        .day-header { padding: 15px 20px; background: repeating-linear-gradient(45deg, #fdfbf7, #fdfbf7 10px, #fff 10px, #fff 20px); border-bottom: 2px dashed #2c3e50; display: flex; justify-content: space-between; align-items: center; }
        .day-header h2 { margin: 0; font-size: 1.4rem; font-weight: 900; }
        .day-tag { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: #fff; border: var(--hand-border); }

        .timeline-wrapper { position: relative; padding: 25px 20px 20px 30px; background: #fffdf7; }
        .timeline-line { position: absolute; left: 16px; top: 25px; bottom: 20px; width: 0; border-left: 2px dashed #a0aec0; z-index: 0; }
        .timeline-item { position: relative; margin-bottom: 35px; z-index: 1; }
        .timeline-dot {
            position: absolute; left: -21px; top: 18px; width: 16px; height: 16px;
            border-radius: 50%; border: 3px solid #2c3e50; background: #fffdf7; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); z-index: 2;
        }
        .timeline-dot.kid-dot { border-color: var(--color-pink); background: #ffe4e1; }
        .timeline-dot.alt-dot { border-color: var(--color-alt); background: #f3e8ff; }
        .timeline-dot.elder-dot { border-color: var(--color-elder); background: #E0F2F1; }

        .card { background: #fff; border: var(--hand-border); border-radius: var(--hand-radius); box-shadow: var(--hand-shadow); overflow: hidden; }
        .card.kid-card { border-color: var(--color-pink); box-shadow: 4px 4px 0px rgba(232, 67, 147, 0.15); }
        .card.alt-card { border-color: var(--color-alt); box-shadow: 4px 4px 0px rgba(123, 45, 139, 0.15); background: #fdf8ff; margin-top: 12px; }
        .card.elder-card { border-color: var(--color-elder); box-shadow: 4px 4px 0px rgba(0, 137, 123, 0.15); background: #F4FFFD; margin-top: 12px; }

        .card-content { padding: 18px; }
        .card-time { font-size: 0.9rem; font-weight: 700; color: #fff; background: var(--text-main); display: inline-block; margin-bottom: 8px; padding: 3px 10px; border-radius: var(--hand-radius); border: 1px solid #2c3e50; }
        .kid-card .card-time { background: var(--color-pink); border-color: #b71540; }
        .alt-card .card-time { background: var(--color-alt); border-color: #4a0070; }
        .elder-card .card-time { background: var(--color-elder); border-color: #004D40; }

        .card-title { font-size: 1.2rem; font-weight: 900; margin: 0 0 10px; color: #111; }
        .kid-title { color: var(--color-pink); display: flex; align-items: center; gap: 6px; }
        .alt-title { color: var(--color-alt); display: flex; align-items: center; gap: 6px; }
        .elder-title { color: var(--color-elder); display: flex; align-items: center; gap: 6px; }

        .alt-label { display: inline-block; background: var(--color-alt); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 20px; margin-bottom: 8px; border: 1px solid #4a0070; }
        .elder-label { display: inline-block; background: var(--color-elder); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 20px; margin-bottom: 8px; border: 1px solid #004D40; }

        .card-desc { font-size: 1rem; color: #444; margin-bottom: 12px; line-height: 1.7; }
        .check-in-alert { background: #FFEBEE; color: #C62828; padding: 12px; font-weight: bold; margin-bottom: 15px; border: 2px solid #C62828; border-radius: var(--hand-radius); }
        .hotel-note { background: #fff3cd; color: #856404; padding: 12px; border-radius: var(--hand-radius); border: 2px dashed #ffeeba; margin-bottom: 12px; font-size: 0.95rem; font-weight: 600; }
        .transport-guide { background: transparent; border: 2px solid #2c3e50; border-radius: var(--hand-radius); padding: 15px; margin-top: 15px; }
        .guide-step { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 0.95rem; }
        .step-num { background: #2c3e50; color: #fff; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 22px; font-size: 0.8rem; margin-right: 10px; flex-shrink: 0; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { flex: 1; text-align: center; padding: 10px 0; text-decoration: none; font-size: 0.95rem; font-weight: bold; background: #fff; color: #2c3e50; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; border: var(--hand-border); border-radius: 255px 25px 225px 15px/15px 225px 15px 255px; box-shadow: 2px 2px 0px rgba(44,62,80,0.2); transition: all 0.2s; min-width: 120px; }
        .btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-primary { background: var(--color-dark-grey); color: white; }
        .btn-gemini-ai { background: #fdfbf7; border: 2px solid #9B72CB; color: #6a1b9a; }
        .btn-alt { background: var(--color-alt); color: white; border-color: #4a0070; }

        .account-card, .tools-card { background: #fffdf7; padding: 22px; margin-bottom: 20px; border: var(--hand-border); border-radius: var(--hand-radius); box-shadow: var(--hand-shadow); }
        .trans-input, .acc-input, .acc-select { width: 100%; padding: 12px; border: 2px solid #2c3e50; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; font-family: inherit; }
        .phrase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
        .phrase-card { border: var(--hand-border); padding: 15px; border-radius: var(--hand-radius); cursor: zoom-in; text-align: left; background: #fff; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .phrase-zh { font-size: 1rem; font-weight: bold; margin-bottom: 6px; }
        .phrase-jp-small { font-size: 0.95rem; color: #B91C1C; font-weight: bold; }
        .coupon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .coupon-card { background: #fff; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border: var(--hand-border); border-radius: 8px; box-shadow: var(--hand-shadow); transition: transform 0.2s; }
        .coupon-img { width: 100%; height: 140px; object-fit: cover; border-bottom: 2px solid #2c3e50; }
        .coupon-content { padding: 15px; }
        .coupon-name { font-size: 1.1rem; font-weight: 900; margin-bottom: 8px; }
        .coupon-offer { font-size: 0.9rem; color: #D32F2F; font-weight: bold; background: #FFEBEE; display: inline-block; padding: 4px 10px; border-radius: 20px; border: 1px solid #D32F2F; }
        .phrase-modal, .coupon-modal { position: fixed; inset: 0; z-index: 1200; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,0.85); backdrop-filter: blur(3px); }
        .phrase-modal.active, .coupon-modal.active { display: flex; }
        .modal-content { position: relative; background: #fffdf7; border: var(--hand-border); border-radius: 12px; padding: 30px 20px; max-width: 480px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto; box-shadow: 8px 8px 0px rgba(0,0,0,0.3); }
        .modal-close { position: absolute; top: 10px; right: 15px; border: none; background: transparent; font-size: 2rem; cursor: pointer; color: #333; font-weight: bold; }
        .cm-img-container img { max-width: 100%; height: auto; border: 2px solid #eee; border-radius: 8px; }
        
        .footer-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #fffdf7; display: flex; justify-content: space-around; 
            /* 優化：加入底部安全區 (Safe Area) 適應底線手勢 */
            padding: 12px 0 calc(25px + env(safe-area-inset-bottom)); 
            border-top: 2px dashed #2c3e50; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); 
        }
        .nav-item { text-align: center; font-size: 0.9rem; color: #888; cursor: pointer; flex: 1; font-weight: bold; }
        .nav-item.active { color: var(--color-dark-grey); }
        .nav-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .gemini-fab { 
            position: fixed; 
            /* 優化：加入底部安全區適應 */
            bottom: calc(95px + env(safe-area-inset-bottom)); 
            right: 20px; width: 60px; height: 60px; background: var(--gemini-gradient); 
            border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; 
            align-items: center; justify-content: center; z-index: 2000; cursor: pointer; 
            font-size: 26px; border: 3px solid #fff; transition: transform 0.2s; 
        }
        .gemini-fab:active { transform: scale(0.9); }
        
        .toast-notification { 
            position: fixed; 
            /* 優化：加入底部安全區適應 */
            bottom: calc(110px + env(safe-area-inset-bottom)); 
            left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(44, 62, 80, 0.9); 
            color: white; padding: 12px 24px; border-radius: 50px; font-size: 0.95rem; font-weight: bold; 
            opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 3000; border: 2px solid #fff; 
        }
        .toast-notification.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        /* 優化：針對極小螢幕的微調 */
        @media (max-width: 480px) { 
            .timeline-wrapper { padding: 20px 15px 20px 25px; } 
            .timeline-line { left: 12px; } 
            .timeline-dot { left: -19px; width: 14px; height: 14px; top: 20px; } 
            
            .top-title { font-size: 1.1rem; }
            .header-rate { padding: 4px 6px; font-size: 0.75rem; }
            .project-tab { padding: 5px 10px; font-size: 0.75rem; }
            .btn { min-width: 100px; padding: 8px 0; font-size: 0.85rem; }
        }
    </style>
</head>
  <body>

<header>
    <div class="header-inner">
        <div class="top-bar">
            <div class="top-title">TOKYO<span class="year">2026</span></div>
            <div class="project-tabs">
                <button id="tab-project2" class="project-tab active" onclick="setProject(2)">家族冬日｜12/19–12/26</button>
                <button id="tab-project1" class="project-tab" onclick="setProject(1)">獨旅鎌倉｜12/13–12/19</button>
            </div>
            <div class="top-right">
                <div id="header-rate" class="header-rate"><span class="symbol">¥</span> 載入中...</div>
            </div>
        </div>
        <div class="project-nav-row">
            <div class="date-scroller active" id="nav-proj2"></div>
            <div class="date-scroller" id="nav-proj1"></div>
        </div>
    </div>
</header>

<main class="container">
    <div class="font-control-panel">
        <button class="font-btn" onclick="changeFontSize(-10)">A- 小</button>
        <div class="font-display" id="font-size-display">100%</div>
        <button class="font-btn" onclick="changeFontSize(10)">A+ 大</button>
    </div>

    <div id="tab-trip" class="section active">
        <div id="itinerary-list"></div>
    </div>

    <div id="tab-account" class="section">
        <div class="account-card">
            <div class="acc-summary" style="text-align:center; padding:20px; background:#fff; border:2px dashed #2c3e50; border-radius:12px;">
                <div style="font-size:0.9rem; color:#666; font-weight:bold;">目前總花費 (JPY)</div>
                <div id="acc-total-val" style="font-size:2.2rem; font-weight:900; color:#1A374D; margin:5px 0;">¥0</div>
                <div id="acc-total-twd" style="font-size:1rem; color:#888;">約 NT$0</div>
                <button class="btn btn-primary" style="margin-top:15px; width:100%;" onclick="analyzeExpenses()">📊 Gemini 分析消費</button>
            </div>
            <div class="acc-form" style="margin-top:20px;">
                <input type="text" id="acc-item" class="acc-input" placeholder="品項 (如: 拉麵)">
                <input type="number" id="acc-cost" class="acc-input" placeholder="金額 (日幣)">
                <select id="acc-type" class="acc-select"><option value="食">🍔 食</option><option value="行">🚄 行</option><option value="購">🛍️ 購</option><option value="住">🏨 住</option><option value="票">🎟️ 票</option></select>
                <button class="btn btn-primary" style="width:100%; background:#e67e22; color:#fff;" onclick="addExpense()">＋ 記錄這筆支出</button>
            </div>
            <ul id="expense-list" style="list-style:none; padding:0; margin-top:25px;"></ul>
        </div>
        <div class="account-card"><h3 style="margin-top:0; color:#B71C1C; border-bottom:2px dashed #B71C1C; padding-bottom:10px;">💰 日本購物優惠券大全</h3><div id="coupon-list" class="coupon-grid"></div></div>
    </div>

    <div id="tab-tools" class="section">
        <div class="tools-card"><h2 style="margin-top:0; border-bottom:2px dashed #2c3e50; padding-bottom:10px;">🗣️ AI 口譯員 (Gemini)</h2><input type="text" id="trans-text" class="trans-input" placeholder="輸入中文 (例如: 可以幫我把醬汁分開裝嗎?)"><div class="btn-group"><button class="btn btn-primary" onclick="callGeminiTranslate('normal')">一般翻譯</button><button class="btn" style="background:#fffdf7; border-color:#e67e22; color:#d35400;" onclick="callGeminiTranslate('polite')">🙇 禮貌敬語</button></div></div>
        <div class="tools-card"><h3 style="margin-top:0; border-bottom:2px dashed #2c3e50; padding-bottom:10px;">🇯🇵 長輩友善指差卡</h3><div id="phrase-grid" class="phrase-grid"></div></div>
    </div>
</main>

<div class="gemini-fab" onclick="askGemini('請協助我辨識這張照片中的內容（例如菜單、路牌、商品），並告訴我這是什麼、是否值得購買或需要注意的事項。')">✨</div>
<div id="toast" class="toast-notification">✅ 指令已複製！請在 Gemini 貼上</div>

<div id="phrase-modal" class="phrase-modal" onclick="closeModal(event, 'phrase-modal')"><div class="modal-content"><button class="modal-close" type="button" onclick="hideModal('phrase-modal')">×</button><div id="modal-jp" style="font-size:2.2rem; font-weight:900; color:#B91C1C; margin-bottom:15px; line-height:1.2;"></div><div id="modal-en" style="font-size:1rem; color:#666; margin-bottom:10px;"></div><div id="modal-zh" style="font-size:1.3rem; font-weight:bold; border-top:2px dashed #ccc; padding-top:15px;"></div><p style="font-size:0.9rem; color:#888; margin-top:20px; background:#eee; padding:5px; border-radius:5px;">已自動複製日文，可直接給店員看。</p></div></div>
<div id="coupon-modal" class="coupon-modal" onclick="closeModal(event, 'coupon-modal')"><div class="modal-content"><button class="modal-close" type="button" onclick="hideModal('coupon-modal')">×</button><div id="cm-title" style="font-size:1.6rem; font-weight:900; color:#1A374D; margin-bottom:15px;"></div><div class="cm-img-container"><img id="cm-img" src="" alt="Coupon"></div><div id="cm-offer" style="font-size:1.3rem; color:#D32F2F; font-weight:bold; background:#FFEBEE; display:inline-block; padding:8px 20px; border-radius:30px; border:2px dashed #D32F2F; margin:15px 0;"></div><a id="cm-link" href="#" target="_blank" class="btn btn-primary" style="width:100%; font-size:1.1rem; padding:12px 0;">前往領取頁面 ➔</a></div></div>

<nav class="footer-nav">
    <div class="nav-item active" onclick="switchTab('trip', this)"><span class="nav-icon">🗺️</span>行程</div>
    <div class="nav-item" onclick="switchTab('account', this)"><span class="nav-icon">📒</span>記帳/優惠</div>
    <div class="nav-item" onclick="switchTab('tools', this)"><span class="nav-icon">🧰</span>工具箱</div>
</nav>

function renderApp(projectId) {
    const listContainer = document.getElementById('itinerary-list');
    const navContainer = document.getElementById('nav-proj' + projectId);
    listContainer.innerHTML = '';
    navContainer.innerHTML = '';

    const currentData = itineraryData.filter(d => d.project === projectId);

    currentData.forEach(day => {
        const chip = document.createElement('div');
        chip.className = 'date-chip';
        if (day.coverImage) chip.style.backgroundImage = `url('${day.coverImage}')`;
        chip.innerHTML = `<span>${day.date.split(' ')[0]}</span>`;
        chip.onclick = () => scrollToDay(day.id, chip);
        navContainer.appendChild(chip);

        let eventsHtml = '';
        day.events.forEach(evt => {
            let alertHtml = evt.checkInNote ? `<div class="check-in-alert">🔴 提醒：起飛前48小時記得線上報到！</div>` : '';
            let hotelHtml = evt.hotelNote ? `<div class="hotel-note">🏨 <b>飯店溝通信件（可直接出示）：</b><br><br>${evt.hotelNote}</div>` : '';

            let guideHtml = '';
            if (evt.transportGuide) {
                guideHtml = `<div class="transport-guide">`;
                evt.transportGuide.forEach((step, i) => { guideHtml += `<div class="guide-step"><div class="step-num">${i + 1}</div><div>${step}</div></div>`; });
                guideHtml += `</div>`;
            }

            const kidCardClass = evt.kidFriendly ? 'kid-card' : '';
            const kidDotClass = evt.kidFriendly ? 'kid-dot' : '';
            const titleHtml = evt.kidFriendly ? `<h3 class="card-title kid-title">👧👦 ${evt.title}</h3>` : `<h3 class="card-title">${evt.title}</h3>`;
            const mapsUrl = `https://maps.google.com/?q=${encodeURIComponent(evt.map || evt.title)}`;

            const hour = parseInt((evt.time || '').split(':')[0]);
            let aiPrompt = `我現在在東京的「${evt.title}」。`;
            if (!isNaN(hour) && ((hour >= 11 && hour <= 14) || (hour >= 18 && hour <= 20))) {
                aiPrompt += `請推薦附近步行5分鐘內的3個在地美食（排除連鎖店），並說明各自特色和大約費用。`;
            } else {
                aiPrompt += `請告訴我這個地方最值得拍攝的角度和時機，以及一個鮮為人知的歷史故事或有趣小知識。`;
            }

            let altHtml = '';
            if (evt.kidFriendly && evt.altEvent) {
                const altMapsUrl = `https://maps.google.com/?q=${encodeURIComponent(evt.altEvent.map || evt.altEvent.title)}`;
                const altPrompt = `我現在在東京的「${evt.altEvent.title.replace(/[🔮🎨☕🛍️]/g, '').trim()}」。請告訴我這裡最值得注意的事項和附近有什麼特色小店或隱藏景點。`;
                altHtml = `
                    <div class="timeline-item">
                        <div class="timeline-dot alt-dot"></div>
                        <div class="card alt-card">
                            <div class="card-content">
                                <span class="alt-label">👨‍💼 大人替代行程</span>
                                <h3 class="card-title alt-title">${evt.altEvent.title}</h3>
                                <div class="card-desc">${evt.altEvent.desc}</div>
                                <div class="btn-group">
                                    <a href="${altMapsUrl}" target="_blank" class="btn btn-alt">🗺️ 導航</a>
                                    <button onclick="askGemini('${altPrompt.replace(/'/g, "\\'")}')" class="btn btn-gemini-ai">✨ AI攻略</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }

            let elderHtml = '';
            if (evt.elderEvent) {
                const elderMapsUrl = `https://maps.google.com/?q=${encodeURIComponent(evt.elderEvent.map || evt.elderEvent.title)}`;
                const elderPrompt = `我現在在東京的「${evt.elderEvent.title.replace(/[👴👵]/g, '').trim()}」。同行有65歲長者，請告訴我這裡周邊的無障礙設施、電梯位置，以及最適合長輩坐著休息的室內地點。`;
                elderHtml = `
                    <div class="timeline-item">
                        <div class="timeline-dot elder-dot"></div>
                        <div class="card elder-card">
                            <div class="card-content">
                                <span class="elder-label">👴👵 長輩友善 / 替代安排</span>
                                <h3 class="card-title elder-title">${evt.elderEvent.title}</h3>
                                <div class="card-desc">${evt.elderEvent.desc}</div>
                                <div class="btn-group">
                                    <a href="${elderMapsUrl}" target="_blank" class="btn" style="background:var(--color-elder);color:#fff;border-color:#004D40;">🗺️ 導航</a>
                                    <button onclick="askGemini('${elderPrompt.replace(/'/g, "\\'")}')" class="btn btn-gemini-ai">✨ AI長輩支援</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }

            eventsHtml += `
                <div class="timeline-item">
                    <div class="timeline-dot ${kidDotClass}"></div>
                    <div class="card ${kidCardClass}">
                        <div class="card-content">
                            <span class="card-time">${evt.time}</span>
                            ${titleHtml}
                            ${alertHtml}
                            ${hotelHtml}
                            <div class="card-desc">${evt.desc}</div>
                            ${guideHtml}
                            <div class="btn-group">
                                <a href="${mapsUrl}" target="_blank" class="btn btn-primary">🗺️ 導航</a>
                                <button onclick="askGemini('${aiPrompt.replace(/'/g, "\\'")}')" class="btn btn-gemini-ai">✨ AI攻略</button>
                            </div>
                        </div>
                    </div>
                </div>
                ${altHtml}
                ${elderHtml}`;
        });

        listContainer.innerHTML += `
            <div id="${day.id}" class="day-section">
                ${day.coverImage ? `<img src="${day.coverImage}" class="day-cover-img" loading="lazy" onerror="this.style.display='none'">` : ''}
                <div class="day-header">
                    <h2>${day.date}</h2>
                    <span class="day-tag" style="background:${projectId === 1 ? '#1a6980' : '#1A374D'}">${projectId === 1 ? '獨旅🌸' : '家族❄️'}</span>
                </div>
                <div class="timeline-wrapper"><div class="timeline-line"></div>${eventsHtml}</div>
            </div>`;
    });
}

function setProject(project) { 
    renderApp(project); 
}

setProject(2);

</script>
