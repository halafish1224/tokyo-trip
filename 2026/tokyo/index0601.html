<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="2026東京冬日深度自由行 - 整合攝影黃金時刻、家族公帳與手寫感筆記系統。">

    <style>
        :root {
            --bg-overlay: rgba(250, 245, 235, 0.98);
            --card-bg: #FFFFFF; 
            --text-main: #1A1A1A; 
            --text-sub: #333333;
            --theme-blue: #0D47A1; 
            --theme-orange: #BF360C; 
            --theme-green: #1B5E20; 
            --theme-red: #B71C1C; 
            --theme-gold: #FFA000; /* 攝影黃金時刻色 */

            --bg-kid: #FCE4EC;
            --border-kid: #D81B60;
            --bg-senior: #E8F5E9;
            --border-senior: #2E7D32;

            /* AIMYON 手繪風定義 */
            --sketch-border: 3px solid #222222; 
            --sketch-shadow: 4px 5px 0px rgba(26, 26, 26, 0.2);
            --radius-sketch: 8px 25px 8px 20px / 25px 8px 20px 8px;
            --radius-btn: 255px 15px 225px 15px / 15px 225px 15px 255px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Klee One', 'Zen Maru Gothic', sans-serif;
            margin: 0; padding-bottom: 95px;
            line-height: 1.8;
            color: var(--text-main); background-color: #FAF5EB;
            font-size: 20px; 
        }

        /* 背景與遮罩 */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://loremflickr.com/2048/3072/tokyo,winter,sky');
            background-size: cover; background-position: center; z-index: -2; opacity: 0.15;
        }
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-overlay); z-index: -1; backdrop-filter: blur(5px);
        }

        header {
            background: rgba(255, 255, 255, 0.98); position: sticky; top: 0; z-index: 100;
            border-bottom: 4px dashed #A1887F; padding: 12px 16px 0;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .top-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 1.7rem; font-weight: 900; color: var(--theme-blue); }
        .top-title span.year { color: var(--theme-orange); margin-left: 6px; }
        .header-rate { font-size: 1rem; color: #fff; background: var(--theme-green); padding: 5px 15px; border-radius: var(--radius-btn); font-weight: 900; border: var(--sketch-border); }

        /* 標籤頁與滾動條 */
        .project-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .project-tab {
            border-radius: var(--radius-btn); border: var(--sketch-border);
            background: #FFF; font-size: 1.2rem; font-weight: 900; color: var(--text-main);
            padding: 10px 16px; cursor: pointer; font-family: inherit; flex: 1; text-align: center;
        }
        .project-tab.active { background: var(--theme-orange); color: #fff; }

        .date-scroller { display: none; overflow-x: auto; padding-bottom: 15px; gap: 12px; scrollbar-width: none; }
        .date-scroller.active { display: flex; }
        .date-chip {
            flex: 0 0 auto; padding: 10px 20px; border-radius: var(--radius-btn);
            border: var(--sketch-border); font-weight: 900; background: #FFF; font-size: 1.1rem;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.2); cursor: pointer; color: var(--text-sub);
        }
        .chip-today { background: var(--theme-green) !important; color: white !important; }
        .chip-selected { background: var(--theme-blue) !important; color: white !important; transform: scale(1.05); }

        .container { padding: 20px 15px; max-width: 600px; margin: 0 auto; }

        /* 卡片設計 */
        .card { background: var(--card-bg); border: var(--sketch-border); border-radius: var(--radius-sketch); box-shadow: var(--sketch-shadow); overflow: hidden; position: relative; transition: transform 0.3s; }
        .card.is-now { border: 4px solid var(--theme-orange); transform: scale(1.02); } /* 當前行程高亮 */
        
        .card-img { width: 100%; height: 240px; object-fit: cover; border-bottom: var(--sketch-border); cursor: zoom-in; }
        .card-content { padding: 22px; }
        .card-time { font-family: 'Zen Maru Gothic', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--theme-orange); }
        .card-title { font-size: 1.7rem; font-weight: 900; margin: 8px 0 12px; }
        .card-title a { color: var(--theme-blue); text-decoration: underline; }

        /* 標籤樣式 */
        .card-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .tag-common { font-size: 0.95rem; padding: 4px 10px; border-radius: 12px; font-weight: 900; border: 2px solid #222; }
        .tag-kid { background: var(--bg-kid); color: var(--border-kid); }
        .tag-senior { background: var(--bg-senior); color: var(--border-senior); }
        .tag-golden { background: #FFF9C4; color: #BF360C; border-color: #FFA000; } /* 攝影提示 */

        /* 檢查清單與速記本樣式 */
        .memo-area { width: 100%; min-height: 150px; background: #FFF; border: var(--sketch-border); border-radius: 10px; padding: 15px; font-family: inherit; font-size: 1.1rem; background-image: radial-gradient(#e5e5e5 1px, transparent 1px); background-size: 20px 20px; }
        .checklist-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed #CCC; font-weight: 600; }
        .checklist-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--theme-green); }
        .checklist-item.checked span { text-decoration: line-through; opacity: 0.5; }

        /* 頁籤導覽 */
        .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #FFF; border-top: 4px solid #222; display: flex; justify-content: space-around; padding: 6px 5px; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.15); }
        .nav-item { text-align: center; flex: 1; font-weight: 900; cursor: pointer; font-size: 0.9rem; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; border: 3px solid transparent; }
        .nav-item.active { color: var(--theme-blue); background: #E3F2FD; border-color: var(--theme-blue); transform: translateY(-4px); }
        .nav-icon { font-size: 1.6rem; }

        /* 模態視窗與其餘元件... (省略重複的樣式以節省空間，請沿用你原本提供的樣式) */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
        
        /* 原有樣式保持不變... */
        .prep-box { background: #FFF; border: 4px solid var(--theme-blue); border-radius: 15px; padding: 18px; margin-bottom: 30px; box-shadow: var(--sketch-shadow); }
        .prep-link { display: block; background: #E3F2FD; border: 3px solid var(--theme-blue); padding: 15px; border-radius: 10px; text-decoration: none; color: var(--theme-blue); font-weight: 900; margin-bottom: 12px; }
        .timeline-wrapper { position: relative; padding-left: 28px; border-left: 4px solid #BCAAA4; }
        .timeline-item { position: relative; margin-bottom: 45px; }
        .timeline-dot { position: absolute; left: -40px; top: 20px; width: 24px; height: 24px; border-radius: 50%; border: 4px solid #FFF; background: var(--theme-orange); box-shadow: 0px 2px 4px rgba(0,0,0,0.3); }
        .img-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(5px); }
        .img-modal.active { display: flex; }
        .modal-content { max-width: 95%; max-height: 80vh; object-fit: contain; }
    </style>
</head>

        { id: 3, text: "備用電池與 SD 卡", checked: false },
        { id: 4, text: "保暖手套與發熱衣", checked: false },
        { id: 5, text: "日幣現金與信用卡", checked: false }
    ];

    // === 初始化功能 ===
    window.onload = function() {
        fetchExchangeRate();
        renderApp();
        renderExpenses();
        renderPackingList();
        loadMemo();
        initAutoScroll();
        setInterval(highlightCurrentEvent, 60000); // 每分鐘檢查一次當前行程
    };

    // === 行程渲染邏輯 (含自動高亮與攝影標籤) ===
    function renderApp() {
        const listContainer = document.getElementById('itinerary-list');
        const navP1 = document.getElementById('nav-p1');
        const navP2 = document.getElementById('nav-p2');
        const todayStr = new Date().toISOString().split('T')[0];

        navP1.innerHTML = ''; navP2.innerHTML = ''; listContainer.innerHTML = '';

        // 生成日期 Chip
        itineraryData.forEach(day => {
            const chip = document.createElement('div');
            const isToday = day.fullDate === todayStr;
            chip.className = `date-chip ${isToday ? 'chip-today' : ''}`;
            chip.innerText = day.date.split(' ')[0];
            chip.onclick = () => scrollToDay(day.id, chip);
            if (day.project === 1) navP1.appendChild(chip); else navP2.appendChild(chip);
        });

        // 渲染行程卡片
        const filteredData = itineraryData.filter(d => d.project === currentProject);
        let html = '';
        filteredData.forEach(day => {
            let eventsHtml = '';
            day.events.forEach(evt => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.map || evt.title)}`;
                const weatherUrl = `https://www.google.com/search?q=${encodeURIComponent((evt.map || evt.title) + ' 天氣')}`;
                
                // 標籤處理
                let tags = '';
                if (evt.suitable?.includes('kid')) tags += '<span class="tag-common tag-kid">👶 兒童友善</span>';
                if (evt.suitable?.includes('senior')) tags += '<span class="tag-common tag-senior">🧓 長青友善</span>';
                if (evt.isGoldenHour) tags += '<span class="tag-common tag-golden">🌇 攝影黃金時刻</span>';

                eventsHtml += `
                    <div class="timeline-item" data-time="${evt.time}">
                        <div class="timeline-dot"></div>
                        <div class="card" id="evt-${evt.time.replace(':','')}">
                            ${evt.img ? `<img src="${evt.img}" class="card-img" loading="lazy" onclick="openImageModal(this.src)">` : ''}
                            <div class="card-content">
                                <span class="card-time">${evt.time}</span>
                                <h3 class="card-title"><a href="${mapUrl}" target="_blank">🔗 ${evt.title}</a></h3>
                                <div class="card-tags">${tags}</div>
                                <div class="card-desc">${evt.desc}</div>
                                <div class="btn-group" style="display:flex; gap:10px; margin-top:15px;">
                                    <a href="${mapUrl}" target="_blank" class="btn btn-primary" style="flex:1; background:var(--theme-blue); color:#fff; padding:10px; border-radius:10px; text-decoration:none; text-align:center; border:var(--sketch-border);">🗺️ 導航</a>
                                    <a href="${weatherUrl}" target="_blank" class="btn btn-weather" style="flex:1; background:#FFF9C4; color:#333; padding:10px; border-radius:10px; text-decoration:none; text-align:center; border:var(--sketch-border);">☁️ 天氣</a>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            html += `<div id="${day.id}" class="day-section"><div class="day-header"><h2>${day.date}</h2></div><div class="timeline-wrapper">${eventsHtml}</div></div>`;
        });
        listContainer.innerHTML = html;
        highlightCurrentEvent();
    }

    // === 自動高亮當前行程 ===
    function highlightCurrentEvent() {
        const now = new Date();
        const currentTime = now.getHours() * 60 + now.getMinutes();
        
        document.querySelectorAll('.card').forEach(card => card.classList.remove('is-now'));
        
        const items = document.querySelectorAll('.timeline-item');
        let currentIdx = -1;

        items.forEach((item, index) => {
            const timeStr = item.getAttribute('data-time');
            const [h, m] = timeStr.split(':').map(Number);
            const eventTime = h * 60 + m;
            if (currentTime >= eventTime) currentIdx = index;
        });

        if (currentIdx !== -1) {
            items[currentIdx].querySelector('.card').classList.add('is-now');
        }
    }

    // === 帳務系統 (支援公帳切換) ===
    function addExpense() {
        const item = document.getElementById('acc-item').value;
        const cost = parseInt(document.getElementById('acc-cost').value);
        const isFamily = document.getElementById('is-family-expense').checked;
        if(!item || !cost) return;

        expenses.unshift({ 
            id: Date.now(), item, cost, isFamily, 
            date: new Date().toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'}) 
        });
        localStorage.setItem('trip_acc_2026', JSON.stringify(expenses));
        document.getElementById('acc-item').value = '';
        document.getElementById('acc-cost').value = '';
        renderExpenses();
    }

    function renderExpenses() {
        const list = document.getElementById('expense-list');
        list.innerHTML = '';
        let totalPersonal = 0;
        let totalFamily = 0;

        expenses.forEach(e => {
            if (e.isFamily) totalFamily += e.cost; else totalPersonal += e.cost;
            list.innerHTML += `
                <li class="checklist-item" style="justify-content: space-between;">
                    <div>
                        <span style="font-weight:900;">${e.isFamily ? '👨‍👩‍👧‍👦' : '👤'} ${e.item}</span>
                        <div style="font-size:0.8rem; opacity:0.6;">${e.date}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:900; color:${e.isFamily ? 'var(--theme-green)' : 'var(--theme-blue)'}">¥${e.cost.toLocaleString()}</span>
                        <button onclick="removeExpense(${e.id})" style="border:none; background:none; font-size:1.5rem; color:red; cursor:pointer;">×</button>
                    </div>
                </li>`;
        });
        document.getElementById('acc-total-personal').innerText = `¥${totalPersonal.toLocaleString()}`;
        document.getElementById('acc-total-family').innerText = `¥${totalFamily.toLocaleString()}`;
    }

    function removeExpense(id) {
        expenses = expenses.filter(e => e.id !== id);
        localStorage.setItem('trip_acc_2026', JSON.stringify(expenses));
        renderExpenses();
    }

    // === 隨身速記本與檢查清單 ===
    function saveMemo() {
        const text = document.getElementById('trip-memo').value;
        localStorage.setItem('trip_memo_2026', text);
    }
    function loadMemo() {
        document.getElementById('trip-memo').value = localStorage.getItem('trip_memo_2026') || "";
    }

    function renderPackingList() {
        const container = document.getElementById('packing-list');
        container.innerHTML = packingItems.map(item => `
            <div class="checklist-item ${item.checked ? 'checked' : ''}" onclick="togglePacking(${item.id})">
                <input type="checkbox" ${item.checked ? 'checked' : ''}>
                <span>${item.text}</span>
            </div>
        `).join('');
    }

    function togglePacking(id) {
        const item = packingItems.find(i => i.id === id);
        item.checked = !item.checked;
        localStorage.setItem('trip_packing_2026', JSON.stringify(packingItems));
        renderPackingList();
    }

    // === 其他輔助功能 (匯率、分頁切換、滾動) ===
    async function fetchExchangeRate() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest?base=JPY');
            const data = await res.json();
            if (data?.rates?.TWD) currentExchangeRate = data.rates.TWD;
        } catch (e) {}
        document.getElementById('header-rate').innerHTML = `<span style="font-size:0.8rem">¥1 =</span> NT$${currentExchangeRate.toFixed(3)}`;
    }

    function switchTab(tabId, navEl) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-' + tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        navEl.classList.add('active');
        window.scrollTo(0, 0);
    }

    function setProject(project) {
        currentProject = project;
        document.getElementById('tab-p1').classList.toggle('active', project === 1);
        document.getElementById('tab-p2').classList.toggle('active', project === 2);
        document.getElementById('nav-p1').classList.toggle('active', project === 1);
        document.getElementById('nav-p2').classList.toggle('active', project === 2);
        renderApp();
    }

    function scrollToDay(id, chipEl) {
        document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('chip-selected'));
        chipEl.classList.add('chip-selected');
        const el = document.getElementById(id);
        const offset = el.getBoundingClientRect().top + window.pageYOffset - 180;
        window.scrollTo({ top: offset, behavior: "smooth" });
    }

    function initAutoScroll() {
        const todayStr = new Date().toISOString().split('T')[0];
        const hasToday = itineraryData.some(d => d.fullDate === todayStr);
        if (hasToday) {
            setTimeout(() => {
                const chip = document.querySelector('.chip-today');
                if (chip) chip.click();
            }, 500);
        }
    }

    // 圖片彈窗
    function openImageModal(src) {
        const m = document.getElementById('imageModal');
        m.style.display = 'flex';
        document.getElementById('modalImg').src = src;
        setTimeout(() => m.classList.add('active'), 10);
    }
    function closeImageModal() {
        const m = document.getElementById('imageModal');
        m.classList.remove('active');
        setTimeout(() => m.style.display = 'none', 300);
    }

    function goKakaku() {
        const val = document.getElementById('input-kakaku').value;
        if(val) window.open(`https://kakaku.com/search_results/${encodeURIComponent(val)}/`, '_blank');
    }
</script>
</body>
</html>
