<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="2026東京冬日14天深度自由行行程表 - 鎌倉獨旅、家族會合完整規劃。包含即時匯率、行程導航與記帳本。">
    <title>東京冬日紀行 2026 | 完整版</title>
    <meta name="theme-color" content="#F5EFE6">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 溫暖紙張底色 */
            --bg-overlay: rgba(253, 251, 246, 0.95);
            --card-bg: #FFFDF8;
            --text-main: #3E3A39;
            --text-sub: #6B635E;
            
            /* 狀態色 */
            --status-future: #D95F59;
            --status-today: #5A8065;    
            --status-past: #A8A096;     

            /* 手繪風四色主題 */
            --theme-blue: #6A8EAE;
            --theme-orange: #E08E55;
            --theme-green: #7D9D7F;
            --theme-red: #C56C6C;

            /* 手繪風格陰影 */
            --sketch-shadow: 3px 4px 0px rgba(62, 58, 57, 0.15);
            --sketch-border: 2px solid #5A5451;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            /* 主要使用手寫風字體 */
            font-family: 'Klee One', 'Zen Maru Gothic', sans-serif;
            margin: 0;
            padding-bottom: 100px; /* 增加底部留白 */
            line-height: 1.7; /* 放大行距，長輩友善 */
            color: var(--text-main);
            min-height: 100vh;
            font-size: 17px; /* 基礎字體放大 */
            background-color: #F5EFE6;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://loremflickr.com/2048/3072/tokyo,winter');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            opacity: 0.6; /* 降低背景干擾 */
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-overlay);
            z-index: -1;
            backdrop-filter: blur(4px);
        }

        header {
            background: rgba(253, 251, 246, 0.98);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px dashed #CFC8B8;
        }

        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 16px 0;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .top-title {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            color: #3E3A39;
            white-space: nowrap;
        }

        .top-title span.year { color: var(--theme-orange); margin-left: 4px; }

        .project-tabs { display: flex; gap: 8px; flex-shrink: 0; }

        .project-tab {
            /* 手繪感不規則圓角 */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            border: var(--sketch-border);
            background: #F4EBE0;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 14px;
            cursor: pointer;
            color: #3E3A39;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            font-family: 'Klee One', sans-serif;
            transition: all 0.2s;
        }

        .project-tab.active { 
            background: #E08E55; 
            color: #fff; 
            border-color: #3E3A39;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2);
        }

        .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .header-date { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }

        .header-rate { 
            font-size: 0.85rem; color: #fff; background: #5A8065; 
            padding: 3px 10px; 
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            border: 1px solid #3E3A39;
            font-weight: bold;
            display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
        }

        .project-nav-row { max-width: 800px; margin: 0 auto; padding: 6px 12px 12px; }

        .date-scroller { display: none; overflow-x: auto; padding: 4px 4px 8px; gap: 12px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-scroller.active { display: flex; }

        .date-chip {
            flex: 0 0 auto; 
            padding: 8px 16px; 
            border-radius: 255px 25px 225px 15px/15px 225px 25px 255px;
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer;
            border: var(--sketch-border);
            box-shadow: 2px 3px 0px rgba(0,0,0,0.1);
            text-align: center;
            font-family: 'Klee One', sans-serif;
        }

        .chip-future { background: #FFFDF8; color: #3E3A39; }
        .chip-today  { background: #5A8065; color: white; border: 2px solid #3E3A39; transform: scale(1.05); }
        .chip-past   { background: #DCD8D3; color: #777; border-style: dashed; }

        .container { padding: 20px 15px; max-width: 600px; margin: 0 auto; }

        .timeline-wrapper { position: relative; padding-left: 24px; margin-top: 15px; }
        /* 虛線時間軸 */
        .timeline-line { position: absolute; left: 10px; top: 15px; bottom: 0; width: 2px; border-left: 2px dashed #BBAFA1; z-index: 0; }
        .timeline-item { position: relative; margin-bottom: 35px; z-index: 1; }
        
        .timeline-dot { 
            position: absolute; left: -22px; top: 25px; width: 18px; height: 18px; 
            border-radius: 50%; border: 3px solid #FFFDF8; 
            background: #E08E55;
            box-shadow: 1px 2px 0px rgba(0,0,0,0.2); z-index: 2; 
        }

        /* 手繪風卡片 */
        .card { 
            background: var(--card-bg); 
            border: var(--sketch-border);
            border-radius: 5px 25px 5px 20px / 25px 5px 20px 5px;
            box-shadow: var(--sketch-shadow); 
            overflow: hidden; 
        }
        .card-img { width: 100%; height: 200px; object-fit: cover; display: block; border-bottom: var(--sketch-border); }
        .card-content { padding: 20px; }
        
        /* 放大時間與標題，長輩友善 */
        .card-time { font-size: 1rem; font-weight: bold; color: #E08E55; display: block; margin-bottom: 6px; font-family: 'Zen Maru Gothic', sans-serif; }
        .card-title { font-size: 1.35rem; font-weight: 900; margin: 0 0 12px; color: #3E3A39; line-height: 1.4; }
        .card-desc { font-size: 1.15rem; color: #4A4542; margin-bottom: 16px; line-height: 1.8; }

        /* 馬克筆劃重點效果 */
        .keyword-orange { background: linear-gradient(transparent 50%, #FFE0B2 50%); display: inline; padding: 0 4px; font-weight: 600; }
        .keyword-blue { background: linear-gradient(transparent 50%, #CDE3F5 50%); display: inline; padding: 0 4px; font-weight: 600; }

        .check-in-alert { 
            background: #FFF0F0; border: 2px solid #D95F59; color: #D95F59; 
            padding: 12px; border-radius: 8px 25px 8px 20px; 
            font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; 
        }
        
        .market-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
        .market-btn { 
            background: #F9F6F0; border: 2px dashed #7D9D7F; 
            padding: 12px 15px; border-radius: 12px; text-decoration: none; display: block; 
        }
        .market-name { font-weight: bold; font-size: 1.1rem; color: #5A8065; }
        .market-meta { font-size: 0.95rem; color: #6B635E; margin-top: 4px; }

        .transport-guide { 
            background: #FDFBF7; border: 2px solid #E4DFD5; 
            border-radius: 10px 25px 10px 20px; padding: 16px; margin-top: 15px; 
        }
        .guide-step { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 1.05rem; }
        .step-num { 
            background: #E08E55; color: #fff; width: 24px; height: 24px; 
            border-radius: 50%; text-align: center; line-height: 24px; 
            font-size: 0.9rem; margin-right: 12px; flex-shrink: 0; font-family: 'Zen Maru Gothic', sans-serif;
        }

        .btn-group { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .btn { 
            flex: 1; text-align: center; padding: 12px 0; 
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            text-decoration: none; font-size: 1.05rem; font-weight: bold; 
            border: var(--sketch-border); box-shadow: 2px 3px 0px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; gap: 6px; 
        }
        .btn-primary { background: #6A8EAE; color: white; }
        .btn-weather { background: #F4EBE0; color: #3E3A39; }

        /* 對話框風格的評論 */
        .review-bubble { 
            position: relative; background: #FFF4E5; border: var(--sketch-border);
            border-radius: 15px 25px 15px 20px; padding: 12px 16px; margin-top: 18px; 
            font-size: 1.05rem; color: #5C4F45; display: flex; gap: 8px; line-height: 1.6;
        }
        .review-bubble::after {
            content: ""; position: absolute; top: -10px; left: 20px;
            border-width: 0 10px 10px 10px; border-style: solid;
            border-color: transparent transparent #5A5451 transparent;
        }

        .tools-card, .account-card { 
            background: var(--card-bg); border: var(--sketch-border); border-radius: 5px 25px 5px 20px; 
            padding: 24px; margin-bottom: 20px; box-shadow: var(--sketch-shadow); 
        }
        .trans-input, .acc-input, .acc-select, .calc-input { 
            width: 100%; padding: 14px; border: 2px solid #DCD8D3; border-radius: 8px; 
            font-size: 1.1rem; font-family: inherit; background: #FFF;
        }
        
        .footer-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #FDFBF7; border-top: 2px solid #5A5451;
            display: flex; justify-content: space-around; padding: 12px 0 28px; 
            z-index: 1000; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); 
        }
        .nav-item { text-align: center; font-size: 1rem; font-weight: bold; color: #A8A096; cursor: pointer; flex: 1; }
        .nav-item.active { color: #E08E55; }
        .nav-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
        
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }

        .day-header { display:flex; justify-content:space-between; align-items:center; margin:20px 0 12px; }
        .day-header h2{ margin:0; font-size:1.4rem; color:#3E3A39; font-weight:900; }
        .day-tag{ 
            display:inline-block; padding:4px 12px; border-radius:255px 15px 225px 15px; 
            font-size:0.9rem; font-weight:bold; color:#fff; border: 1px solid #3E3A39;
        }

        .theme-blue .timeline-dot, .theme-blue .day-tag { background: var(--theme-blue); }
        .theme-orange .timeline-dot, .theme-orange .day-tag { background: var(--theme-orange); }
        .theme-green .timeline-dot, .theme-green .day-tag { background: var(--theme-green); }
        .theme-red .timeline-dot, .theme-red .day-tag { background: var(--theme-red); }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="top-bar">
            <div class="top-title">
                TOKYO<span class="year">2026</span>
            </div>
            <div class="top-right">
                <span class="header-date" id="header-clock">讀取中...</span>
                <div id="header-rate" class="header-rate"><span class="symbol">¥</span> ...</div>
            </div>
        </div>
        <div class="project-tabs" style="margin-bottom: 12px;">
            <button id="tab-project1" class="project-tab active" onclick="setProject(1)">
                📓 P1 獨旅篇
            </button>
            <button id="tab-project2" class="project-tab" onclick="setProject(2)">
                👨‍👩‍👧‍👦 P2 家族篇
            </button>
        </div>
        <div class="project-nav-row" style="padding: 0;">
            <div class="date-scroller active" id="nav-proj1"></div>
            <div class="date-scroller" id="nav-proj2"></div>
        </div>
    </div>
</header>

<main class="container">
    <div id="tab-trip" class="section active">
        <div id="itinerary-list"></div>
    </div>

    <div id="tab-account" class="section">
        <div class="account-card">
            <div style="background: #F9F6F0; padding: 20px; border-radius: 12px; margin-bottom: 25px; text-align: center; border: 2px dashed #CFC8B8;">
                <div style="font-size: 1rem; color: #6B635E; margin-bottom: 5px;">目前總花費 (JPY)</div>
                <div id="acc-total-val" style="font-size: 2.2rem; font-weight: 900; color: #D95F59; font-family: 'Zen Maru Gothic';">¥0</div>
                <div id="acc-total-twd" style="font-size: 1.1rem; color: #6B635E; font-weight: bold;">約 NT$0</div>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="acc-item" class="acc-input" placeholder="品項 (例: 拉麵)">
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                <input type="number" id="acc-cost" class="acc-input" placeholder="金額 (日幣)">
                <select id="acc-type" class="acc-select" style="width: auto;">
                    <option value="食">🍔 食</option>
                    <option value="行">🚄 行</option>
                    <option value="購">🛍️ 購</option>
                    <option value="住">🏨 住</option>
                </select>
                <button class="btn btn-primary" style="padding: 0 20px; margin: 0;" onclick="addExpense()">＋</button>
            </div>
            <h3 style="margin: 0 0 15px; border-bottom: 2px solid #E4DFD5; padding-bottom: 10px;">支出明細</h3>
            <ul id="expense-list" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </div>

    <div id="tab-tools" class="section">
        <div class="tools-card">
            <h2 style="margin-top:0">💱 匯率計算機</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="flex: 1;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">日幣 (JPY)</label>
                    <input type="number" id="calc-jpy" class="calc-input" placeholder="0" oninput="calcToTWD()">
                </div>
                <div style="font-size: 1.5rem; color: #E08E55; margin-top: 25px;">➔</div>
                <div style="flex: 1;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">台幣 (TWD)</label>
                    <input type="number" id="calc-twd" class="calc-input" placeholder="0" style="background:#F4EBE0;" readonly>
                </div>
            </div>
        </div>
    </div>
</main>

<nav class="footer-nav">
    <div class="nav-item active" onclick="switchTab('trip', this)"><span class="nav-icon">🗺️</span>行程</div>
    <div class="nav-item" onclick="switchTab('account', this)"><span class="nav-icon">📒</span>記帳</div>
    <div class="nav-item" onclick="switchTab('tools', this)"><span class="nav-icon">🧰</span>工具</div>
</nav>

<script>
    let currentExchangeRate = 0.215;

    // === 行程資料庫 (整合家族篇 12/19-12/26，增添 12/23 岩崎庭園) ===

        {

    function getDateStatus(dateStr) {
        const target = new Date(dateStr).setHours(0,0,0,0);
        const today = new Date().setHours(0,0,0,0); 
        if (target < today) return 'chip-past';
        if (target === today) return 'chip-today';
        return 'chip-future';
    }

    async function fetchExchangeRate() {
        const rateEl = document.getElementById('header-rate');
        try {
            const res = await fetch('https://open.er-api.com/v6/latest?base=JPY');
            if (res.ok) {
                const data = await res.json();
                if (data && data.rates && data.rates.TWD) currentExchangeRate = data.rates.TWD;
            }
        } catch (e) {}
        rateEl.innerHTML = `<span class="symbol">¥</span>1 = NT$${currentExchangeRate.toFixed(3)}`;
        calcToTWD();
        renderExpenses();
    }

    function calcToTWD() {
        const jpy = document.getElementById('calc-jpy').value;
        const twdInput = document.getElementById('calc-twd');
        if(jpy && currentExchangeRate > 0) twdInput.value = Math.round(jpy * currentExchangeRate);
        else twdInput.value = "";
    }

    let expenses = JSON.parse(localStorage.getItem('tokyo_expenses_2026')) || [];
    function addExpense() {
        const item = document.getElementById('acc-item').value;
        const cost = parseInt(document.getElementById('acc-cost').value);
        const type = document.getElementById('acc-type').value;
        if (!item || !cost) return;
        expenses.unshift({ id: Date.now(), item, cost, type, date: new Date().toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'}) });
        localStorage.setItem('tokyo_expenses_2026', JSON.stringify(expenses));
        document.getElementById('acc-item').value = ''; document.getElementById('acc-cost').value = '';
        renderExpenses();
    }
    function removeExpense(id) {
        expenses = expenses.filter(e => e.id !== id);
        localStorage.setItem('tokyo_expenses_2026', JSON.stringify(expenses));
        renderExpenses();
    }
    function renderExpenses() {
        const list = document.getElementById('expense-list');
        list.innerHTML = '';
        let total = 0;
        expenses.forEach(e => {
            total += e.cost;
            const li = document.createElement('li');
            li.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px dashed #E4DFD5;";
            li.innerHTML = `
                <div style="flex: 1;">
                    <div style="font-weight: bold; font-size: 1.1rem; color: #3E3A39;">${e.type} ${e.item}</div>
                    <div style="font-size: 0.9rem; color: #A8A096;">${e.date}</div>
                </div>
                <div style="font-weight: 900; color: #5A8065; font-size: 1.15rem; margin-right: 15px;">¥${e.cost.toLocaleString()}</div>
                <button style="background: #FFF0F0; color: #D95F59; border: 2px solid #D95F59; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-weight: bold;" onclick="removeExpense(${e.id})">×</button>
            `;
            list.appendChild(li);
        });
        document.getElementById('acc-total-val').innerText = `¥${total.toLocaleString()}`;
        document.getElementById('acc-total-twd').innerText = `約 NT$${Math.round(total * currentExchangeRate).toLocaleString()}`;
    }

    function renderApp() {
        const navProj1 = document.getElementById('nav-proj1');
        const navProj2 = document.getElementById('nav-proj2');
        const listContainer = document.getElementById('itinerary-list');
        
        itineraryData.forEach(day => {
            const statusClass = getDateStatus(day.fullDate);
            const chip = document.createElement('div');
            chip.className = `date-chip ${statusClass}`;
            chip.innerText = day.date.split(' ')[0];
            chip.onclick = () => scrollToDay(day.id, chip);
            if (day.project === 1) navProj1.appendChild(chip);
            else navProj2.appendChild(chip);
        });

        let html = '';
        itineraryData.forEach(day => {
            let eventsHtml = '';
            day.events.forEach((evt) => {
                const imgHtml = evt.img ? `<img src="${evt.img}" class="card-img" alt="${evt.title}" loading="lazy">` : '';
                let alertHtml = evt.checkInNote ? `<div class="check-in-alert">🔔 ${evt.checkInNote} - 請確認線上報到</div>` : '';
                
                let guideHtml = '';
                if (evt.transportGuide) {
                    guideHtml = `<div class="transport-guide">`;
                    evt.transportGuide.forEach((step, i) => {
                        guideHtml += `<div class="guide-step"><div class="step-num">${i+1}</div><div>${step}</div></div>`;
                    });
                    guideHtml += `</div>`;
                }

                let marketHtml = '';
                if (evt.supermarkets) {
                    marketHtml = `<div class="market-grid">`;
                    evt.supermarkets.forEach(m => {
                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=$${encodeURIComponent(m.map)}`;
                        marketHtml += `<a href="${mapUrl}" target="_blank" class="market-btn"><div class="market-name">${m.name}</div><div class="market-meta">${m.meta}</div></a>`;
                    });
                    marketHtml += `</div>`;
                }

                const mapQuery = evt.map || evt.title;
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=$${encodeURIComponent(mapQuery)}`;
                const weatherUrl = `https://www.google.com/search?q=${encodeURIComponent(mapQuery + ' 天氣')}`;
                const reviewHtml = evt.review ? `<div class="review-bubble"><span>💡</span><div>${evt.review}</div></div>` : '';

                eventsHtml += `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="card">
                            ${imgHtml}
                            <div class="card-content">
                                <span class="card-time">${evt.time}</span>
                                <h3 class="card-title">${evt.title}</h3>
                                ${alertHtml}
                                <div class="card-desc">${evt.desc}</div>
                                ${guideHtml}
                                <div class="btn-group">
                                    <a href="${mapUrl}" target="_blank" class="btn btn-primary">🗺️ 導航</a>
                                </div>
                                ${marketHtml}
                                ${reviewHtml}
                            </div>
                        </div>
                    </div>`;
            });

            html += `
                <div id="${day.id}" class="day-section ${day.theme}">
                    <div class="day-header">
                        <h2>${day.date}</h2>
                        <span class="day-tag">Day Trip</span>
                    </div>
                    <div class="timeline-wrapper"><div class="timeline-line"></div>${eventsHtml}</div>
                </div>`;
        });
        listContainer.innerHTML = html;
    }

    function scrollToDay(id, chipEl) {
        chipEl.style.transform = "scale(0.9)";
        setTimeout(()=> chipEl.style.transform = "scale(1)", 200);
        const el = document.getElementById(id);
        const offsetPosition = el.getBoundingClientRect().top + window.pageYOffset - 160;
        window.scrollTo({ top: offsetPosition, behavior: "smooth" });
    }

    function switchTab(tabId, navEl) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        navEl.classList.add('active');
        window.scrollTo(0, 0);
    }

    function setProject(project){
        const nav1 = document.getElementById('nav-proj1'), nav2 = document.getElementById('nav-proj2');
        const t1 = document.getElementById('tab-project1'), t2 = document.getElementById('tab-project2');
        if (project === 1){
            nav1.classList.add('active'); nav2.classList.remove('active');
            t1.classList.add('active'); t2.classList.remove('active');
        } else {
            nav1.classList.remove('active'); nav2.classList.add('active');
            t1.classList.remove('active'); t2.classList.add('active');
        }
    }

    function updateTime() {
        const now = new Date();
        document.getElementById('header-clock').innerText =
            now.toLocaleDateString('zh-TW', {month:'numeric', day:'numeric', weekday:'short'}) + ' ' +
            now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
    }

    function initAutoScroll() {
        const todayChips = document.querySelectorAll('.chip-today');
        if (todayChips.length > 0) {
            const todayChip = todayChips[0];
            const isP2 = todayChip.parentElement.id === 'nav-proj2';
            setProject(isP2 ? 2 : 1);
            setTimeout(() => { todayChip.click(); }, 500);
        } else {
            setProject(1);
        }
    }

    setInterval(updateTime, 1000);
    updateTime();
    fetchExchangeRate();
    renderApp();
    renderExpenses();
    setTimeout(initAutoScroll, 200);

</script>
