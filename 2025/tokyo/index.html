    // === 工具函數 (以下維持上次版本) ===

    function getCheckInDateStr(flightDateStr) {

        const flightDate = new Date(flightDateStr);

        const checkInDate = new Date(flightDate);

        checkInDate.setDate(flightDate.getDate() - 2);

        return (checkInDate.getMonth()+1) + '/' + checkInDate.getDate();

    }



    function getDateStatus(dateStr) {

        const target = new Date(dateStr).setHours(0,0,0,0);


        // 使用真實日期或模擬日期 (如果 MOCK_TODAY 有值)

        const today = MOCK_TODAY ? new Date(MOCK_TODAY).setHours(0,0,0,0) : new Date().setHours(0,0,0,0);



        if (target < today) return 'chip-past';

        if (target === today) return 'chip-today';

        return 'chip-future';

    }




    // ** FIX 1: 匯率修復 **


    // 匯率已在上方設定為固定值 0.2009015

    function initializeExchangeRate() {

        const rateEl = document.getElementById('header-rate');

        const infoEl = document.getElementById('calc-rate-info');




        // 更新 Header UI: 顯示 1日圓等於多少新台幣 (標註 Google 來源)

        rateEl.innerHTML = `<span>¥</span>1 = NT$${currentExchangeRate.toFixed(4)} <span style="font-size:0.75rem; font-weight:normal;">(Google)</span>`;

        infoEl.innerText = `即時匯率: 1 JPY = NT$${currentExchangeRate.toFixed(6)}`;



        calcToTWD();

    }



    function calcToTWD() {

        const jpy = document.getElementById('calc-jpy').value;

        const twdInput = document.getElementById('calc-twd');

        if(jpy && currentExchangeRate > 0) {


            // 計算結果四捨五入到整數

            twdInput.value = Math.round(jpy * currentExchangeRate); 

        } else {

            twdInput.value = "";

        }

    }




    // ** FIX 2: 導覽列分頁邏輯 **

    function switchProject(projectId, buttonEl) {


        // 1. 切換按鈕樣式

        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

        if (buttonEl) {

            buttonEl.classList.add('active');

        } else {


            // 首次載入時設置預設 active

            document.querySelector(`.project-tab-header .tab-button:nth-child(${projectId})`).classList.add('active');

        }







        // 2. 切換內容顯示

        document.querySelectorAll('.project-content').forEach(content => content.classList.remove('active'));

        document.getElementById(`project-content-${projectId}`).classList.add('active');




        // 3. 滾動到第一個行程點


        // 在切換 Project 時，滾動頁面到導覽列下方，方便查看日期清單

        const headerOffset = document.querySelector('.project-nav-container').offsetHeight + 10;

        window.scrollTo({ top: headerOffset, behavior: "smooth" });

    }

    let expenses = JSON.parse(localStorage.getItem('travelExpenses')) || [];



    function getCategoryColor(category) {

        switch (category) {


            case '食': return '#FBC02D'; // Yellow - Food


            case '住': return '#1976D2'; // Blue - Accommodation


            case '行': return '#4CAF50'; // Green - Transport


            case '樂': return '#E91E63'; // Pink - Entertainment


            case '買': return '#9C27B0'; // Purple - Shopping


            default: return '#757575';   // Grey - Other


            case '食': return '#FBC02D'; 


            case '住': return '#1976D2'; 


            case '行': return '#4CAF50'; 


            case '樂': return '#E91E63'; 


            case '買': return '#9C27B0'; 


            default: return '#757575';   

        }

    }



    function saveExpenses() {

        localStorage.setItem('travelExpenses', JSON.stringify(expenses));

        renderExpenses();

    }



    function addExpense() {

        const jpy = document.getElementById('account-jpy').value;

        const item = document.getElementById('account-item').value.trim();

        const category = document.getElementById('account-category').value;



        if (!jpy || jpy <= 0) {

            alert("請輸入有效的日幣金額！");

            return;

        }



        const newExpense = {

            id: Date.now(),

            jpy: parseInt(jpy, 10),

            item: item || '無說明',

            category: category,

            date: new Date().toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'})

        };



        expenses.push(newExpense);

        saveExpenses();




        // Clear inputs

        document.getElementById('account-jpy').value = '';

        document.getElementById('account-item').value = '';

    }



    function deleteExpense(id) {

        expenses = expenses.filter(exp => exp.id !== id);

        saveExpenses();

    }



    function clearExpenses() {

        if (confirm("確定要清空所有記帳記錄嗎？此操作無法復原！")) {

            expenses = [];

            saveExpenses();

        }

    }



    function renderExpenses() {

        const listBody = document.getElementById('expense-list').querySelector('tbody');

        const totalJpyEl = document.getElementById('total-jpy');

        const totalTwdEl = document.getElementById('total-twd');



        listBody.innerHTML = '';

        let totalJpy = 0;




        // Sort by ID descending (newest first)

        expenses.sort((a, b) => b.id - a.id);



        expenses.forEach(exp => {

            totalJpy += exp.jpy;

            const row = listBody.insertRow();

            row.style.borderBottom = '1px dashed #EEE';




            // Category Cell (col 1)

            row.insertCell().innerHTML = `<div style="padding:5px; text-align:left;"><span style="display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; border-radius:4px; font-size:0.8rem; font-weight:bold; color:white; background:${getCategoryColor(exp.category)}">${exp.category[0]}</span></div>`;




            // Item Cell (col 2)

            const itemCell = row.insertCell();

            itemCell.style.padding = '5px';

            itemCell.innerHTML = `<div>${exp.item}</div><div style="font-size:0.7rem; color:#888;">${exp.date}</div>`;




            // JPY Cell (col 3)

            const jpyCell = row.insertCell();

            jpyCell.style.padding = '5px';

            jpyCell.style.textAlign = 'right';

            jpyCell.style.fontWeight = 'bold';

            jpyCell.innerText = exp.jpy.toLocaleString();




            // Delete Button Cell (col 4)

            const deleteCell = row.insertCell();

            deleteCell.style.padding = '5px';

            deleteCell.style.textAlign = 'center';

            deleteCell.innerHTML = `<button onclick="deleteExpense(${exp.id})" style="background:none; border:none; color:#D32F2F; cursor:pointer; font-size:1.1rem; padding:0;">×</button>`;

        });



        const totalTwd = Math.round(totalJpy * currentExchangeRate);



        totalJpyEl.innerText = totalJpy.toLocaleString() + ' JPY';

        totalTwdEl.innerText = totalTwd.toLocaleString() + ' TWD';

    }






    // === 新增：指差卡渲染與互動邏輯 ===


    // === 指差卡渲染與互動邏輯 (上次修改版本，維持不變) ===



    // 渲染常用語句卡片

    function renderPhrases() {

        const grid = document.getElementById('phrase-grid');

        grid.innerHTML = '';



        commonPhrases.forEach(phrase => {

            const card = document.createElement('div');

            card.className = 'phrase-card';


            // 點擊事件：傳遞整個 phrase 物件

            card.onclick = () => showPhraseModal(phrase); 



            card.innerHTML = `

                <div style="font-size:1.1rem; color:#1A374D; font-weight:bold;">${phrase.chinese}</div>

                <div style="color:#D32F2F;">${phrase.japanese}</div>

                <div style="color:#666; font-size:0.85rem;">${phrase.english}</div>

            `;

            grid.appendChild(card);

        });

    }



    // 顯示放大後的指差卡

    function showPhraseModal(phrase) {

        const modalOverlay = document.getElementById('phrase-modal-overlay');

        const modalContent = document.getElementById('phrase-modal-content');



        modalContent.innerHTML = `

            <button class="modal-close-btn" onclick="closePhraseModal()">×</button>

            <div class="phrase-chinese">中文：${phrase.chinese}</div>

            <h3>${phrase.japanese}</h3>

            <div class="phrase-romanji">${phrase.romanji}</div>

            <div class="phrase-english">English: ${phrase.english}</div>

        `;



        modalOverlay.classList.add('active');


        document.body.style.overflow = 'hidden'; // 防止背景滾動


        document.body.style.overflow = 'hidden'; 

    }



    // 關閉放大後的指差卡

    function closePhraseModal() {

        const modalOverlay = document.getElementById('phrase-modal-overlay');

        modalOverlay.classList.remove('active');


        document.body.style.overflow = ''; // 恢復背景滾動


        document.body.style.overflow = ''; 

    }




    // === 渲染邏輯 (原有) ===


    // === 渲染行程邏輯 (維持上次版本) ===

    function renderApp() {

        const navProj1 = document.getElementById('nav-proj1');

        const navProj2 = document.getElementById('nav-proj2');

        const listContainer = document.getElementById('itinerary-list');



        // 渲染導航

        itineraryData.forEach((day, index) => {

            const statusClass = getDateStatus(day.fullDate);

            const chip = document.createElement('div');



            chip.className = `date-chip ${statusClass}`;

            chip.innerText = day.date.split(' ')[0];

            chip.onclick = () => scrollToDay(day.id, chip);



            if (day.project === 1) navProj1.appendChild(chip);

            else navProj2.appendChild(chip);

        });



        // 渲染行程

        let html = '';

        itineraryData.forEach(day => {

            let eventsHtml = '';

            day.events.forEach((evt, idx) => {


                // ** 圖片邏輯 **


                const imgUrl = evt.img || ''; // 確保有圖片 URL


                const imgUrl = evt.img || ''; 

                const imgHtml = imgUrl ? `<img src="${imgUrl}" class="card-img" alt="${evt.title}" loading="lazy" onerror="this.style.display='none';">` : '';



                let alertHtml = '';

                if (evt.checkInNote) {

                    const checkInDate = getCheckInDateStr(day.fullDate);

                    alertHtml = `<div class="check-in-alert">🔴 提醒：線上報到與選位 (起飛前48小時：${checkInDate} 開放)</div>`;

                }



                let noteHtml = '';

                if (evt.pelicanData) {

                    noteHtml = `<div class="pelican-note">`;

                    evt.pelicanData.forEach(line => noteHtml += `<div>${line}</div>`);

                    noteHtml += `</div>`;

                }



                let contingencyHtml = '';

                if (evt.time === '16:00' && evt.title.includes('備用計畫')) {


                     // 特殊處理 D14 的備用計畫

                    contingencyHtml = `<div class="contingency-note">

                        <h4 style="margin:0; font-size:1rem;">替代/備用行程</h4>

                        <p style="margin:5px 0 0 0;">${evt.desc.replace(/⚠️.*：/,'')}</p>

                    </div>`;


                    evt.desc = ''; // 清空原 desc


                    evt.desc = '';

                }





                let guideHtml = '';

                if (evt.transportGuide) {

                    guideHtml = `<div class="transport-guide">`;

                    evt.transportGuide.forEach((step, i) => {

                        guideHtml += `<div class="guide-step"><div class="step-num">${i+1}</div><div>${step}</div></div>`;

                    });

                    guideHtml += `</div>`;

                }



                let marketHtml = '';

                if (evt.supermarkets) {

                    marketHtml = `<div class="market-grid">`;

                    evt.supermarkets.forEach(m => {


                        // 使用 Google Maps 導航連結 (原程式碼中的 'https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.map)}' 似乎有錯誤，修正為標準格式)

                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.map)}`;

                        marketHtml += `

                            <a href="${mapUrl}" target="_blank" class="market-btn">

                                <div class="market-name"> ${m.name}</div>

                                <div class="market-meta">${m.meta}</div>

                            </a>`;

                    });

                    marketHtml += `</div>`;

                }




                // 修正導航連結中的錯誤

                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.map || evt.title)}`;

                const weatherUrl = `https://www.google.com/search?q=${encodeURIComponent((evt.map || evt.title) + ' 天氣')}`;



                const btnsHtml = `

                    <div class="btn-group">

                        <a href="${mapUrl}" target="_blank" class="btn btn-primary">🗺️ 導航</a>

                        <a href="${weatherUrl}" target="_blank" class="btn btn-weather">☁️ 天氣</a>

                    </div>

                `;



                eventsHtml += `

                    <div class="timeline-item">

                        <div class="timeline-dot"></div>

                        <div class="card">

                            ${imgHtml}

                            <div class="card-content">

                                <span class="card-time">${evt.time}</span>

                                <h3 class="card-title">${evt.title}</h3>

                                ${alertHtml}

                                <div class="card-desc">${evt.desc}</div>

                                ${noteHtml}

                                ${contingencyHtml}

                                ${guideHtml}

                                ${btnsHtml}

                                ${marketHtml}

                                ${evt.review ? `<div class="review-bubble"><span>💬</span><div>${evt.review}</div></div>` : ''}

                            </div>

                        </div>

                        ${evt.next ? `<div class="next-stop">🚶 下一站：${evt.next.time} (${evt.next.dist})</div>` : ''}

                    </div>

                `;

            });



            html += `

                <div id="${day.id}" class="day-section ${day.theme}">

                    <div class="day-header">

                        <h2>${day.date}</h2>

                        <span class="day-tag" style="background:var(--${day.theme})">Day Trip</span>

                    </div>

                    <div class="timeline-wrapper">

                        <div class="timeline-line"></div>

                        ${eventsHtml}

                    </div>

                </div>

            `;

        });

        listContainer.innerHTML = html;




        // 渲染常用語句

        renderPhrases();

    }



    // === 互動功能 (原有) ===

    function scrollToDay(id, chipEl) {

        chipEl.style.transform = "scale(0.9)";

        setTimeout(()=> chipEl.style.transform = "scale(1)", 200);



        const el = document.getElementById(id);

        const headerOffset = 130; 

        const offsetPosition = el.getBoundingClientRect().top + window.pageYOffset - headerOffset;



        window.scrollTo({ top: offsetPosition, behavior: "smooth" });

    }



    function switchTab(tabId, navEl) {

        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

        document.getElementById('tab-' + tabId).classList.add('active');

        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        navEl.classList.add('active');

        window.scrollTo(0, 0);


        // 渲染記帳

        if (tabId === 'tools') renderExpenses();

    }



    function googleTranslate() {

        const text = document.getElementById('trans-text').value;

        if(text) window.open(`https://translate.google.com/?sl=zh-TW&tl=ja&text=${encodeURIComponent(text)}&op=translate`, '_blank');

    }




    // 移除 copyText 函式，因為放大卡片功能已經滿足需求。


    // function copyText(text) {


    //     navigator.clipboard.writeText(text).then(() => alert('已複製：' + text));


    // }




    function updateTime() {

        const now = new Date();

        document.getElementById('header-clock').innerText = now.toLocaleDateString('zh-TW', {month:'numeric', day:'numeric', weekday:'short'}) + ' ' + now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});

    }



    // Init

    setInterval(updateTime, 1000);

    updateTime();


    initializeExchangeRate(); // 載入固定匯率


    initializeExchangeRate();

    renderApp();


    renderExpenses(); // 初始化時載入記帳數據


    renderExpenses(); 




    // 設置預設為 PROJECT 1

    switchProject(1); 



</script>
