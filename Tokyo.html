<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>

  <!-- 告知搜尋引擎不要收錄這一頁 -->
  <meta name="robots" content="noindex,nofollow,noarchive,max-snippet:0" />

  <!-- 傳統 meta refresh 轉址（備援） -->
  <meta http-equiv="refresh" content="0;url=https://travel.itigre.com/2026/tokyo/" />

  <script>
    // 優先使用 JS 轉址
    window.location.replace("https://travel.itigre.com/2025/tokyo/");
  </script>
</head>
<body>
  <p>
    正在為您導向 Tokyo 頁面…<br />
    若未自動跳轉，請點選：
    <a href="https://travel.itigre.com/2025/tokyo/">https://travel.itigre.com/2025/tokyo/</a>
  </p>
</body>
</html>
